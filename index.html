<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Jacqueline - Englisholic</title>
    
    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 32px 24px;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #f1f5f9;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }

        p.subtitle {
            font-size: 15px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-kakao {
            background-color: #FEE500;
            color: #000000;
        }

        .btn-kakao:active {
            transform: scale(0.98);
        }

        .btn-vapi {
            background-color: #22c55e;
            color: #ffffff;
        }

        .btn-vapi.active {
            background-color: #ef4444;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .vapi-status {
            margin-top: 16px;
            font-size: 14px;
            color: #64748b;
            display: none;
        }

        #vapi-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Teacher Profile Section -->
        <img src="jacqueline.png" alt="Teacher Jacqueline" class="profile-img" onerror="this.onerror=null; this.src='jacqueline.jpg';">
        <h1>Teacher Jacqueline</h1>
        <p class="subtitle">1:1 원어민 AI 영어회화 무료 체험<br>지금 바로 통화를 시작해 보세요!</p>

        <!-- PAGE 1: Kakao Login Gate -->
        <div id="auth-container">
            <button id="login-btn" class="btn btn-kakao" type="button" onclick="loginWithKakao()">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M9 2C5.134 2 2 4.418 2 7.4C2 9.328 3.254 11.018 5.158 12.016L4.484 14.492C4.418 14.734 4.694 14.928 4.902 14.79L7.842 12.836C8.22 12.894 8.606 12.926 9 12.926C12.866 12.926 16 10.508 16 7.526C16 4.418 12.866 2 9 2Z" fill="#000000"/>
                </svg>
                <span id="btn-text-content">카카오로 1초만에 시작하기</span>
            </button>
        </div>

        <!-- PAGE 2: Active Call Screen -->
        <div id="vapi-container">
            <button id="call-btn" class="btn btn-vapi" type="button" onclick="toggleCall()">
                <span id="call-btn-text">📞 통화 시작하기</span>
            </button>
            <div id="call-status" class="vapi-status">연결 준비 완료</div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const GAS_URL = "https://script.google.com/macros/s/AKfycby4C0SsERlnAJsjcK3SOUgdqERywyqJB6YyWqTHHRFfbVC3XzXzE_d9mEKJgtb3t_q_jA/exec"; 
        const KAKAO_CLIENT_ID = "6f7519b766b027481f792e3272958dfb";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const VAPI_PUBLIC_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;
        let isCallActive = false;

        // Step 1: Initialize Kakao Login Redirect
        function loginWithKakao() {
            const kakaoAuthUrl = `https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${KAKAO_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = kakaoAuthUrl;
        }

        // Step 2: Handle Kakao Redirect & Google Sheets Verification on Load
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                document.getElementById("btn-text-content").innerText = "인증 확인 중...";

                let userIdentifier = localStorage.getItem("englisholic_user_id");
                if (!userIdentifier) {
                    userIdentifier = "kakao_user_" + Math.random().toString(36).substring(2, 8);
                    localStorage.setItem("englisholic_user_id", userIdentifier);
                }

                const requestUrl = GAS_URL + "?email=" + encodeURIComponent(userIdentifier) + 
                                   "&userId=" + encodeURIComponent(userIdentifier) + 
                                   "&identifier=" + encodeURIComponent(userIdentifier) + 
                                   "&t=" + Date.now();

                fetch(requestUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ALREADY_USED") {
                            alert("이미 무료 체험을 사용하셨습니다.");
                            document.getElementById("btn-text-content").innerText = "무료 체험 완료됨";
                            document.getElementById("login-btn").style.opacity = "0.6";
                            document.getElementById("login-btn").onclick = function() {
                                alert("이미 무료 체험을 사용하셨습니다.");
                            };
                        } else {
                            // First time user: Hide Page 1 and show Page 2 (Call Screen)
                            document.getElementById("auth-container").style.display = "none";
                            document.getElementById("vapi-container").style.display = "flex";
                            initVapi();
                        }
                    })
                    .catch(err => {
                        alert("서버 연결 확인 실패. 다시 시도해 주세요.");
                    });
            }
        };

        // Step 3
