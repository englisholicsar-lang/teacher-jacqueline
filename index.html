<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Englisholic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #eef7ff;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative Background Waves */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 220px;
            background: linear-gradient(180deg, #dbeafe 0%, #eef7ff 100%);
            border-bottom-left-radius: 50% 20px;
            border-bottom-right-radius: 50% 20px;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px 20px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Header Logo */
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .logo-box img {
            height: 48px;
        }

        /* Profile Section */
        .profile-section {
            margin-bottom: 20px;
            position: relative;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        .profile-section h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .profile-section p {
            font-size: 14px;
            color: #64748b;
        }

        /* Permission Card Notice */
        .notice-card {
            width: 100%;
            background: #f0f7ff;
            border: 1px solid #d0e3ff;
            border-radius: 14px;
            padding: 16px;
            margin: 16px 0 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #1e40af;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
        }

        .notice-card span {
            font-size: 20px;
        }

        /* Helper Text */
        .guide-text {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
            margin-top: 8px;
        }

        .guide-text strong {
            color: #0f172a;
        }

        /* Floating Call Button */
        .floating-btn-container {
            position: fixed;
            bottom: 30px;
            right: 24px;
            z-index: 999;
        }

        .call-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #34d399;
            border: none;
            color: #0f172a;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(52, 211, 153, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .call-btn:active {
            transform: scale(0.92);
        }

        .call-btn:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-box">
            <img src="logo.png" alt="Englisholic Logo" onerror="this.style.display='none'">
        </div>

        <!-- Profile -->
        <div class="profile-section">
            <img src="jacqueline.png" alt="Teacher Jacqueline" class="profile-img">
            <h1>Teacher Jacqueline</h1>
            <p>재클린 선생님과의 1:1 맞춤 영어회화</p>
        </div>

        <!-- Notice -->
        <div class="notice-card">
            <span>🎙️</span>
            <div>원활한 통화를 위해 마이크 권한을<br>허용해 주세요.</div>
        </div>

        <!-- Instruction -->
        <p class="guide-text">
            우측 하단의 📞 <strong>통화 버튼</strong>을 눌러<br>
            Jacqueline 선생님과 무료 체험 수업을<br>
            시작하세요!
        </p>
    </div>

    <!-- Floating Call Button -->
    <div class="floating-btn-container">
        <button id="vapi-call-btn" class="call-btn" onclick="startTrialCall()">
            📞
        </button>
    </div>

    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwI7Gu1wnzQIzOQAeqDZRuHK8UgceArMjxwZTg4i9mLRuu8_QTrYCJHmXExsKbY3WRraQ/exec";
        let vapiInstance = null;

        async function getDeviceHash() {
            const rawIdentifier = [
                navigator.userAgent,
                screen.width + "x" + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.language
            ].join("|");

            const msgBuffer = new TextEncoder().encode(rawIdentifier);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function startTrialCall() {
            const btn = document.getElementById("vapi-call-btn");
            btn.disabled = true;

            try {
                const deviceHash = await getDeviceHash();

                // 1. Check existing record
                const response = await fetch(`${GAS_WEB_APP_URL}?deviceHash=${deviceHash}`);
                const result = await response.json();

                if (result.exists) {
                    alert("무료 체험은 1회만 제공됩니다.");
                    btn.disabled = false;
                    return;
                }

                // 2. Log attempt
                await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ deviceHash: deviceHash })
                });

                // 3. Launch Vapi Call
                vapiInstance = window.vapiSDK.run({
                    apiKey: "YOUR_VAPI_PUBLIC_KEY",
                    assistant: "YOUR_VAPI_ASSISTANT_ID"
                });

            } catch (err) {
                console.error("Error launching call:", err);
                alert("통화 연결 중 오류가 발생했습니다. 다시 시도해주세요.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
