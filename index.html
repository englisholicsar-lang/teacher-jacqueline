<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Englishholic - Teacher Jacqueline</title>

  <!-- 1. Kakao SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" integrity="sha384-Ti2B4Ua20KK13LSc82E3M4Pj5Lks2Oshs3e4u+TksyMthvWzWd+aWJIn+3+E1/N1" crossorigin="anonymous"></script>

  <!-- 2. Vapi Web SDK -->
  <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      margin-bottom: 0.5rem;
      color: #333;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .btn-kakao {
      background-color: #FEE500;
      color: #000000;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: background-color 0.2s;
    }
    .btn-kakao:hover {
      background-color: #fada0A;
    }
    #status {
      margin-top: 1.5rem;
      font-weight: 500;
      color: #4A5568;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Teacher Jacqueline</h1>
    <p>Practice 1-on-1 English speaking with AI Teacher Jacqueline.</p>
    
    <!-- One-Tap Call Button -->
    <button class="btn-kakao" onclick="startKakaoTrial()">
      💬 카카오 1초 로그인으로 체험 시작하기
    </button>

    <div id="status">로그인 후 통화가 연결됩니다.</div>
  </div>

  <script>
    // Initialize Kakao SDK with your key
    if (!Kakao.isInitialized()) {
      Kakao.init('adad030abdf866a8b3be558c979ddb03');
    }

    // Initialize Vapi SDK (Replace with your Vapi Public Key & Assistant ID)
    const vapiApiKey = 'YOUR_VAPI_PUBLIC_KEY'; 
    const assistantId = 'YOUR_VAPI_ASSISTANT_ID';
    
    let vapiInstance = null;

    if (window.vapiSDK) {
      vapiInstance = window.vapiSDK.run({
        apiKey: vapiApiKey,
      });
    }

    // One-Tap Kakao Login Function
    function startKakaoTrial() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "카카오 인증 진행 중...";

      Kakao.Auth.login({
        success: function(authObj) {
          Kakao.API.request({
            url: '/v2/user/me',
            success: function(res) {
              const kakaoUserId = res.id; // Unique Kakao numerical ID
              console.log("Logged in Kakao User ID:", kakaoUserId);
              
              statusDiv.innerText = "인증 완료! 통화 연결 중...";

              // Start the Vapi Call
              startVapiCall(kakaoUserId);
            },
            fail: function(error) {
              console.error("Failed to fetch Kakao user profile:", error);
              statusDiv.innerText = "프로필 정보를 가져오지 못했습니다.";
            }
          });
        },
        fail: function(err) {
          console.error("Kakao Login failed:", err);
          statusDiv.innerText = "카카오 로그인에 실패했습니다.";
        }
      });
    }

    // Start Vapi Call & Trigger 9-Minute Cue
    function startVapiCall(userId) {
      if (!vapiInstance) {
        alert("Vapi SDK가 아직 로드되지 않았습니다.");
        return;
      }

      // Start Vapi call
      vapiInstance.start(assistantId);

      // Set 9-minute (540,000 ms) wrap-up trigger
      setTimeout(() => {
        console.log("9-Minute Cue Triggered for Kakao User:", userId);
        
        // Send wrap-up instruction prompt to Jacqueline
        if (vapiInstance) {
          vapiInstance.send({
            type: 'add-message',
            message: {
              role: 'system',
              content: 'Please let the user know we have 1 minute remaining in our trial lesson and start wrapping up smoothly.'
            }
          });
        }
      }, 540000); // 9 minutes = 540,000 ms
    }
  </script>

</body>
</html>
