<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Jacqueline - Free Trial</title>
    
    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        :root {
            --bg-base: #f0f6ff;
            --primary-navy: #0e2a47;
            --sub-text: #4a637d;
            --box-bg: #eaf3fe;
            --box-border: #d4e5f9;
            --kakao-yellow: #fee500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background-color: var(--bg-base);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            color: var(--primary-navy);
        }

        /* SVG Background Curves */
        .bg-wave-top {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 500px;
            height: auto;
            z-index: 0;
            pointer-events: none;
            opacity: 0.8;
        }

        .bg-wave-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            max-width: 500px;
            height: auto;
            z-index: 0;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Dot Pattern Accents */
        .dot-pattern-left {
            position: absolute;
            top: 380px;
            left: 15px;
            width: 60px;
            height: 100px;
            background-image: radial-gradient(#c2dcfc 2px, transparent 2px);
            background-size: 12px 12px;
            z-index: 0;
        }

        .dot-pattern-right {
            position: absolute;
            top: 220px;
            right: 15px;
            width: 60px;
            height: 100px;
            background-image: radial-gradient(#c2dcfc 2px, transparent 2px);
            background-size: 12px 12px;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Logo Header */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-svg {
            width: 56px;
            height: 56px;
        }

        .logo-text {
            text-align: left;
        }

        .logo-text-main {
            font-size: 28px;
            font-weight: 800;
            color: #0c2a4a;
            line-height: 1.05;
            letter-spacing: -0.5px;
        }

        .logo-text-sub {
            font-size: 13px;
            font-weight: 700;
            color: #0c2a4a;
            letter-spacing: 0.1px;
        }

        /* Teacher Avatar Profile */
        .avatar-container {
            position: relative;
            width: 165px;
            height: 165px;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px rgba(12, 42, 74, 0.15), 0 0 0 12px rgba(255, 255, 255, 0.4);
        }

        /* Title & Subtitle */
        .title {
            font-size: 30px;
            font-weight: 800;
            color: #0c2a4a;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 600;
            color: #4a637d;
            margin-bottom: 22px;
        }

        /* Mic Info Box */
        .info-box {
            width: 100%;
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 18px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(12, 42, 74, 0.03);
        }

        .info-box-icon {
            font-size: 26px;
            flex-shrink: 0;
        }

        .info-box-text {
            font-size: 15px;
            font-weight: 700;
            color: #1a3c61;
            line-height: 1.35;
            text-align: center;
        }

        /* Yellow Button */
        .kakao-btn {
            width: 100%;
            background-color: var(--kakao-yellow);
            color: #000000;
            border: none;
            padding: 18px 20px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(254, 229, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s ease;
        }

        .kakao-btn:active {
            transform: scale(0.98);
        }

        .kakao-btn-icon {
            font-size: 22px;
        }

        #vapi-container {
            display: none;
            width: 100%;
        }

        .call-btn {
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            border: none;
            padding: 18px 20px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Background Graphics -->
    <svg class="bg-wave-top" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0H500V80C400 140 250 160 0 60V0Z" fill="#dbeafe" fill-opacity="0.7"/>
    </svg>
    <svg class="bg-wave-bottom" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 200H500V120C350 180 150 140 0 200Z" fill="#dbeafe" fill-opacity="0.7"/>
    </svg>

    <div class="dot-pattern-left"></div>
    <div class="dot-pattern-right"></div>

    <!-- PAGE 1: AUTH GATE -->
    <div id="auth-container" class="container">
        
        <!-- Pillar Logo -->
        <div class="logo-wrapper">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="url(#logo_grad)"/>
                <path d="M25 38H75V43H25V38ZM30 46H35V68H30V46ZM43 46H48V68H43V46ZM56 46H61V68H56V46ZM68 46H73V68H68V46ZM25 71H75V75H25V71ZM50 25L75 35H25L50 25Z" fill="white"/>
                <defs>
                    <linearGradient id="logo_grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#0062b1"/>
                        <stop offset="1" stop-color="#092543"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="logo-text">
                <div class="logo-text-main">Englisholic</div>
                <div class="logo-text-sub">Innovative English</div>
            </div>
        </div>

        <!-- Teacher Avatar -->
        <div class="avatar-container">
            <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Teacher Jacqueline">
        </div>

        <!-- Title Block -->
        <h1 class="title">Teacher Jacqueline</h1>
        <p class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>

        <!-- Mic Permission Card -->
        <div class="info-box">
            <span class="info-box-icon">🎙️</span>
            <span class="info-box-text">원활한 통화를 위해 마이크 권한을<br>허용해 주세요.</span>
        </div>

        <!-- Yellow Kakao Start Button -->
        <button id="login-btn" class="kakao-btn" onclick="startKakaoAuth()">
            <span class="kakao-btn-icon">💬</span>
            <span id="btn-text-content">무료 체험 통화 시작하기</span>
        </button>
    </div>

    <!-- PAGE 2/3: TRIAL CALL (PRESERVED LOGIC) -->
    <div id="vapi-container" class="container">
        <div class="logo-wrapper">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="url(#logo_grad_2)"/>
                <path d="M25 38H75V43H25V38ZM30 46H35V68H30V46ZM43 46H48V68H43V46ZM56 46H61V68H56V46ZM68 46H73V68H68V46ZM25 71H75V75H25V71ZM50 25L75 35H25L50 25Z" fill="white"/>
                <defs>
                    <linearGradient id="logo_grad_2" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#0062b1"/>
                        <stop offset="1" stop-color="#092543"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="logo-text">
                <div class="logo-text-main">Englisholic</div>
                <div class="logo-text-sub">Innovative English</div>
            </div>
        </div>

        <div class="avatar-container">
            <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Teacher Jacqueline">
        </div>

        <h1 class="title">Teacher Jacqueline</h1>
        <p id="call-status" class="subtitle">아래 버튼을 눌러 통화를 시작하세요!</p>

        <button id="start-call-btn" class="call-btn" onclick="startVapiCall()">
            📞 통화 시작하기
        </button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby5kz-Y8bNFNVhcSZjhHqPyqzV5JKJRoO-xlhu3jb_VCqnKAz8-ukixS6p0t6Hf6iu52A/exec";
        const REDIRECT_URI = "https://englisholicsar-lang.github.io/teacher-jacqueline/";
        const KAKAO_CLIENT_ID = "4800b51cb8a7d1862dc4b2725633ea69";

        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;

        function startKakaoAuth() {
            const authUrl = "https://kauth.kakao.com/oauth/authorize?client_id=" + KAKAO_CLIENT_ID + 
                            "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) + 
                            "&response_type=code";
            window.location.href = authUrl;
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                document.getElementById("btn-text-content").innerText = "인증 확인 중...";
                
                var userId = "kakao_code_" + authCode.substring(0, 15);
                
                fetch(GAS_URL + "?userId=" + encodeURIComponent(userId) + "&t=" + Date.now())
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ALREADY_USED") {
                            alert("이미 무료 체험을 사용하셨습니다.");
                            document.getElementById("btn-text-content").innerText = "무료 체험 종료됨";
                        } else {
                            document.getElementById("auth-container").style.display = "none";
                            document.getElementById("vapi-container").style.display = "flex";
                        }
                    })
                    .catch(err => {
                        alert("서버 연결 실패");
                    });
            }
        };

        function startVapiCall() {
            if (window.vapiSDK) {
                vapiInstance = window.vapiSDK.run({
                    apiKey: VAPI_KEY,
                    assistant: VAPI_ASSISTANT_ID
                });
                vapiInstance.start(VAPI_ASSISTANT_ID);
                document.getElementById("call-status").innerText = "통화 연결 중...";
            } else {
                alert("Vapi SDK 로딩 실패");
            }
        }
    </script>
</body>
</html>
