<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Jacqueline - Free Trial</title>
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
    <style>
        :root {
            --primary-color: #4A90E2;
            --kakao-yellow: #FEE500;
            --vapi-green: #25D366;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-gradient);
        }

        .card {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #e0e0e0;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #2c3e50;
        }

        p {
            font-size: 15px;
            color: #666666;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        .btn {
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .kakao-btn {
            background-color: var(--kakao-yellow);
            color: #000000;
            box-shadow: 0 4px 12px rgba(254, 229, 0, 0.4);
        }

        .call-btn {
            background-color: var(--vapi-green);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        }

        #vapi-container {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Kakao Auth Gate Card -->
    <div id="auth-container" class="card">
        <div class="avatar">👩‍🏫</div>
        <h2>Teacher Jacqueline 1회 무료 체험</h2>
        <p id="status-text">무료 체험 진행을 위해 카카오 계정으로 본인 인증을 진행해 주세요.</p>
        <button id="login-btn" class="btn kakao-btn" onclick="startKakaoAuth()">
            <span>💬</span> 카카오로 1초 만에 시작하기
        </button>
    </div>

    <!-- Active Trial Card -->
    <div id="vapi-container" class="card">
        <div class="avatar">🎙️</div>
        <h2>Teacher Jacqueline과의 영어 대화</h2>
        <p id="call-status">아래 버튼을 눌러 통화를 시작하세요!</p>
        <button id="start-call-btn" class="btn call-btn" onclick="startVapiCall()">
            📞 통화 시작하기
        </button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby5kz-Y8bNFNVhcSZjhHqPyqzV5JKJRoO-xlhu3jb_VCqnKAz8-ukixS6p0t6Hf6iu52A/exec";
        const REDIRECT_URI = "https://englisholicsar-lang.github.io/teacher-jacqueline/";
        const KAKAO_CLIENT_ID = "4800b51cb8a7d1862dc4b2725633ea69";

        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;

        function startKakaoAuth() {
            const authUrl = "https://kauth.kakao.com/oauth/authorize?client_id=" + KAKAO_CLIENT_ID + 
                            "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) + 
                            "&response_type=code";
            window.location.href = authUrl;
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                document.getElementById("status-text").innerText = "인증 정보를 확인 중입니다...";
                document.getElementById("login-btn").style.display = "none";
                
                var userId = "kakao_code_" + authCode.substring(0, 15);
                
                fetch(GAS_URL + "?userId=" + encodeURIComponent(userId) + "&t=" + Date.now())
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ALREADY_USED") {
                            alert("이미 무료 체험을 사용하셨습니다.");
                            document.getElementById("status-text").innerText = "무료 체험이 종료되었습니다.";
                        } else {
                            document.getElementById("auth-container").style.display = "none";
                            document.getElementById("vapi-container").style.display = "block";
                        }
                    })
                    .catch(err => {
                        alert("서버 연결 실패");
                    });
            }
        };

        function startVapiCall() {
            if (window.vapiSDK) {
                vapiInstance = window.vapiSDK.run({
                    apiKey: VAPI_KEY,
                    assistant: VAPI_ASSISTANT_ID
                });
                vapiInstance.start(VAPI_ASSISTANT_ID);
                document.getElementById("call-status").innerText = "통화 연결 중...";
            } else {
                alert("Vapi SDK 로딩 실패");
            }
        }
    </script>
</body>
</html>
