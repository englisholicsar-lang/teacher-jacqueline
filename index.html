<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Jacqueline - Free Trial</title>
    
    <meta property="og:title" content="Teacher Jacqueline - Free Trial">
    <meta property="og:description" content="재클린 선생님과의 1:1 맞춤 영어회화 10분 무료 체험">
    <meta property="og:image" content="https://englisholicsar-lang.github.io/teacher-jacqueline/og_preview.png">
    <meta property="og:url" content="https://englisholicsar-lang.github.io/teacher-jacqueline/">
    <meta property="og:type" content="website">

    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>

    <script>
      var vapiInstance = null;
      (function (d, t) {
        var g = d.createElement(t),
          s = d.getElementsByTagName(t)[0];
        g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g, s);
      })(document, "script");
    </script>

    <style>
        :root {
            --bg-base: #f0f6ff;
            --primary-navy: #0e2a47;
            --sub-text: #4a637d;
            --box-bg: #eaf3fe;
            --box-border: #d4e5f9;
            --kakao-yellow: #fee500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background-color: var(--bg-base);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0px 20px 20px 20px;
            color: var(--primary-navy);
        }

        .bg-wave-top, .bg-wave-bottom { position: absolute; width: 100%; max-width: 500px; height: auto; z-index: 0; pointer-events: none; opacity: 0.8; }
        .bg-wave-top { top: 0; right: 0; }
        .bg-wave-bottom { bottom: 0; left: 0; }

        .dot-pattern-left { position: absolute; top: 220px; left: 10px; width: 45px; height: 80px; background-image: radial-gradient(#c2dcfc 2px, transparent 2px); background-size: 10px 10px; z-index: 0; }
        .dot-pattern-right { position: absolute; top: 80px; right: 10px; width: 45px; height: 80px; background-image: radial-gradient(#c2dcfc 2px, transparent 2px); background-size: 10px 10px; z-index: 0; }

        .container { position: relative; z-index: 1; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .upper-group { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 6px; }
        .logo-wrapper { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .logo-img { height: 75px; width: auto; object-fit: contain; }
        .avatar-container { position: relative; width: 115px; height: 115px; margin-bottom: 8px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ffffff; box-shadow: 0 6px 18px rgba(12, 42, 74, 0.12), 0 0 0 6px rgba(255, 255, 255, 0.4); cursor: pointer; }
        .title { font-size: 22px; font-weight: 800; color: #0c2a4a; margin-bottom: 2px; letter-spacing: -0.3px; }
        .subtitle { font-size: 13.5px; font-weight: 600; color: #4a637d; }

        .timer-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 12px; }
        .timer-display { font-size: 18px; font-weight: 800; color: #0e2a47; background-color: #ffffff; padding: 8px 18px; border-radius: 20px; border: 2px solid #d4e5f9; box-shadow: 0 4px 10px rgba(12, 42, 74, 0.06); display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; }

        .bottom-group { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 24px; }
        .info-box { width: 100%; background-color: var(--box-bg); border: 1px solid var(--box-border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(12, 42, 74, 0.03); }
        .info-box-text { width: 100%; text-align: center; line-height: 1.45; }

        .kakao-btn { width: 100%; background-color: var(--kakao-yellow); color: #000000; border: none; padding: 15px 18px; border-radius: 14px; font-size: 16.5px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(254, 229, 0, 0.45); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; }
        .kakao-btn:disabled { background-color: #a0aec0; box-shadow: none; cursor: not-allowed; color: #ffffff; }

        iframe[title*="vapi"], iframe[src*="vapi"], .vapi-btn { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <svg class="bg-wave-top" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0H500V80C400 140 250 160 0 60V0Z" fill="#dbeafe" fill-opacity="0.7"/>
    </svg>
    <svg class="bg-wave-bottom" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 200H500V120C350 180 150 140 0 200Z" fill="#dbeafe" fill-opacity="0.7"/>
    </svg>

    <div class="dot-pattern-left"></div>
    <div class="dot-pattern-right"></div>

    <audio id="remote-audio" autoplay playsinline controls volume="1.0" style="display: none;"></audio>

    <div id="main-container" class="container">
        <div class="upper-group">
            <div class="logo-wrapper">
                <img src="https://englisholicsar-lang.github.io/teacher-jacqueline/logo.png" alt="Englisholic Logo" class="logo-img">
            </div>
            <div class="avatar-container">
                <img class="avatar-img" id="dev-avatar" src="https://englisholicsar-lang.github.io/teacher-jacqueline/jacqueline.png" alt="Teacher Jacqueline">
            </div>
            <h1 class="title">Teacher Jacqueline</h1>
            <p id="call-status" class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>
            
            <div id="timer-wrapper" class="timer-wrapper" style="display: none;">
                <div id="timer" class="timer-display">⏱️ 00:00 / 10:00</div>
            </div>
        </div>

        <div class="bottom-group">
            <div id="notice-box" class="info-box">
                <span class="info-box-text" style="font-size: 13.5px; font-weight: 700; color: #1a3c61;">
                    원활한 통화를 위해 마이크 권한을<br>허용해 주세요.
                </span>
            </div>

            <button id="action-btn" class="kakao-btn" onclick="handleMainAction()" disabled>
                <span class="kakao-btn-icon">💬</span>
                <span id="btn-text-content">⏳ 인증 상태 확인 중...</span>
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby4eY6zCdRRE_3x4su1_6uIg3PQ6DXU5sd4x6sW6WiakmbzU-8DtP3w6GG99ubETJMj/exec";
        const KAKAO_CLIENT_ID = "4800b51cb8a7d1862dc4b2725633ea69";
        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "ab0d16c5-842d-40c6-8fa4-055fee015089";

        const ADMIN_KAKAO_ID = "5138574735";
        const ADMIN_DEVICE_HASH = "dev_o8usv4vz4pmvgwa9ft";

        let callState = 'IDLE'; 
        let isUserAllowed = false; 
        let timerInterval = null;
        let secondsElapsed = 0;
        
        let cachedKakaoId = "N/A";
        let cachedKakaoNickname = "Kakao User";

        function getDeviceHash() {
            try {
                let hash = localStorage.getItem("englisholic_device_hash");
                if (!hash) {
                    const rawString = [navigator.userAgent, navigator.language, screen.width + "x" + screen.height, screen.colorDepth, new Date().getTimezoneOffset()].join("|");
                    let h = 0;
                    for (let i = 0; i < rawString.length; i++) {
                        h = (h << 5) - h + rawString.charCodeAt(i);
                        h |= 0;
                    }
                    hash = "DEV-" + Math.abs(h).toString(16).toUpperCase();
                    localStorage.setItem("englisholic_device_hash", hash);
                }
                return hash;
            } catch (err) {
                return "DEV-FALLBACK-" + Math.floor(Math.random() * 100000);
            }
        }

        function showLockoutUI() {
            isUserAllowed = false;
            document.getElementById("main-container").innerHTML = `
                <div class="upper-group" style="margin-top: 10px;">
                    <div class="logo-wrapper">
                        <img src="https://englisholicsar-lang.github.io/teacher-jacqueline/logo.png" alt="Englisholic Logo" class="logo-img">
                    </div>
                    <div class="avatar-container">
                        <img class="avatar-img" src="https://englisholicsar-lang.github.io/teacher-jacqueline/jacqueline.png" alt="Teacher Jacqueline">
                    </div>
                    <h1 class="title">Teacher Jacqueline</h1>
                    <p class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>
                </div>
                <div class="bottom-group" style="margin-top: 20px;">
                    <div class="info-box" style="padding: 16px;">
                        <span class="info-box-text" style="font-size: 14px; font-weight: 700; color: #0e2a47; line-height: 1.5;">
                            🔒 무료 체험 수업은 1회만 가능합니다.
                        </span>
                    </div>
                    <a href="tel:1877-5079" class="kakao-btn" style="text-decoration: none; margin-top: 8px; background-color: #0e2a47; color: #ffffff; box-shadow: 0 4px 12px rgba(14,42,71,0.2);">
                        <span>📞 고객센터 문의하기 (1877-5079)</span>
                    </a>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof Kakao !== "undefined" && !Kakao.isInitialized()) {
                    Kakao.init(KAKAO_CLIENT_ID);
                }
            } catch (e) {
                console.log("Kakao init warning:", e);
            }

            // 🛠️ SECRET KNOCK BACKDOOR (MOBILE OPTIMIZED) 🛠️
            let tapCount = 0;
            let tapTimer = null;
            const avatar = document.getElementById('dev-avatar');
            if (avatar) {
                // Prevent mobile browsers from zooming or saving the image on rapid taps
                avatar.style.webkitTouchCallout = "none";
                avatar.style.userSelect = "none";
                avatar.style.webkitUserSelect = "none";
                avatar.style.touchAction = "manipulation";

                // Use pointerdown to register raw touches instantly
                avatar.addEventListener('pointerdown', () => {
                    tapCount++;
                    
                    // Reset the counter if you stop tapping for 1.5 seconds
                    clearTimeout(tapTimer);
                    tapTimer = setTimeout(() => { tapCount = 0; }, 1500);

                    if (tapCount === 5) {
                        isUserAllowed = true;
                        const btn = document.getElementById("action-btn");
                        if (btn) {
                            btn.disabled = false;
                            btn.style.backgroundColor = "#e05252";
                            btn.style.color = "#ffffff";
                            document.getElementById("btn-text-content").innerText = "🛠️ Admin Override Active";
                        }
                        alert("VIP Admin Access Granted.");
                    }
                });
            }

            const deviceHash = getDeviceHash();
            const btn = document.getElementById("action-btn");
            const btnText = document.getElementById("btn-text-content");

            try {
                let response = await fetch(`${GAS_URL}?action=checkUser&deviceHash=${deviceHash}`);
                let result = await response.json();

                // Case-insensitive hash check
                if (result && result.allowed === false && deviceHash.toLowerCase() !== ADMIN_DEVICE_HASH.toLowerCase()) {
                    showLockoutUI();
                } else {
                    isUserAllowed = true;
                    btn.disabled = false;
                    btnText.innerText = "카카오 로그인 및 통화 시작";
                }
            } catch (err) {
                isUserAllowed = true;
                btn.disabled = false;
                btnText.innerText = "카카오 로그인 및 통화 시작";
            }
        });

        function handleMainAction() {
            if (!isUserAllowed) return;

            const remoteAudio = document.getElementById("remote-audio");
            if (remoteAudio) {
                remoteAudio.volume = 1.0;
                remoteAudio.play().catch(e => console.log("Audio unlock tap", e));
            }

            if (callState === 'IDLE') {
                const btn = document.getElementById("action-btn");
                const btnText = document.getElementById("btn-text-content");
                
                // Keep visually unlocked if admin backdoor was used
                if (btnText.innerText !== "🛠️ Admin Override Active") {
                    btn.disabled = true;
                    btnText.innerText = "⏳ 데이터베이스 확인 중...";
                }

                if (typeof Kakao === "undefined" || !Kakao.isInitialized()) {
                    alert("카카오 연결에 실패했습니다. 페이지를 새로고침 해주세요.");
                    btn.disabled = false;
                    btnText.innerText = "카카오 로그인 및 통화 시작";
                    return;
                }

                Kakao.Auth.login({
                    success: function(authObj) {
                        Kakao.API.request({
                            url: '/v2/user/me',
                            success: async function(res) {
                                cachedKakaoId = res.id ? res.id.toString() : "N/A";
                                if (res.properties && res.properties.nickname) {
                                    cachedKakaoNickname = res.properties.nickname;
                                }

                                try {
                                    const deviceHash = getDeviceHash();
                                    let response = await fetch(`${GAS_URL}?action=checkUser&kakaoId=${cachedKakaoId}&deviceHash=${deviceHash}`);
                                    
                                    let text = await response.text();
                                    let result;
                                    try {
                                        result = JSON.parse(text);
                                    } catch(e) {
                                        if (btnText.innerText !== "🛠️ Admin Override Active") showLockoutUI();
                                        else proceedWithCall();
                                        return; 
                                    }

                                    if (result && result.allowed === false && deviceHash.toLowerCase() !== ADMIN_DEVICE_HASH.toLowerCase() && cachedKakaoId !== ADMIN_KAKAO_ID) {
                                        if (btnText.innerText !== "🛠️ Admin Override Active") showLockoutUI();
                                        else proceedWithCall();
                                    } else {
                                        proceedWithCall(); 
                                    }
                                } catch(err) {
                                    if (btnText.innerText !== "🛠️ Admin Override Active") showLockoutUI();
                                    else proceedWithCall();
                                }
                            },
                            fail: function(error) {
                                alert("카카오 프로필을 가져오지 못했습니다.");
                                btn.disabled = false;
                                btnText.innerText = "카카오 로그인 및 통화 시작";
                            }
                        });
                    },
                    fail: function(err) {
                        btn.disabled = false;
                        btnText.innerText = "카카오 로그인 및 통화 시작";
                    }
                });

            } else if (callState === 'ACTIVE') {
                if (vapiInstance && typeof vapiInstance.stop === 'function') {
                    vapiInstance.stop();
                }
                endCallUI();
            }
        }

        function proceedWithCall() {
            if (!isUserAllowed) return;
            sendWebRegistration(cachedKakaoId, cachedKakaoNickname);
            startVapiCall();
        }

        function sendWebRegistration(kakaoId, nickname) {
            const payload = {
                type: "web-registration",
                kakaoId: kakaoId,
                kakaoNickname: nickname,
                deviceHash: getDeviceHash()
            };

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Web reg error:", err));
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById("timer-wrapper").style.display = "flex";

            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById("timer").innerText = "⏱️ " + formatTime(secondsElapsed) + " / 10:00";
                
                if (secondsElapsed === 300) { 
                    if (vapiInstance && typeof vapiInstance.send === 'function') {
                        vapiInstance.send({ type: "add-message", message: { role: "system", content: "[SYSTEM TIME CHECK: 5 MINUTES ELAPSED. 5 MINUTES REMAINING.]" }});
                    }
                }

                if (secondsElapsed === 540) { 
                    if (vapiInstance && typeof vapiInstance.send === 'function') {
                        vapiInstance.send({ type: "add-message", message: { role: "system", content: "[SYSTEM TIME CHECK: 9 MINUTES ELAPSED. 1 MINUTE REMAINING. FOCUS ENTIRELY ON WRAPPING UP.]" }});
                    }
                }

                if (secondsElapsed === 585) { 
                    if (vapiInstance && typeof vapiInstance.send === 'function') {
                        vapiInstance.send({ type: "add-message", message: { role: "system", content: "[CRITICAL SYSTEM ALERT: 10 MINUTES REACHED. YOU MUST IMMEDIATELY SAY GOODBYE AND EXECUTE THE end_tutoring_session TOOL IN YOUR VERY NEXT TURN. DO NOT ANSWER ANY MORE QUESTIONS.]" }});
                    }
                }

                if (secondsElapsed >= 600) { 
                    stopTimer();
                    if (vapiInstance && typeof vapiInstance.stop === 'function') vapiInstance.stop();
                    endCallUI();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function startVapiCall() {
            const sdk = window.vapiSDK || window.vapi || (window.Vapi ? window.Vapi : null);
            if (sdk) {
                vapiInstance = typeof sdk.run === 'function' 
                    ? sdk.run({ apiKey: VAPI_KEY, assistant: VAPI_ASSISTANT_ID })
                    : new sdk(VAPI_KEY);

                if (vapiInstance && typeof vapiInstance.on === 'function') {
                    vapiInstance.on('call-start', () => {
                        startTimer();
                        const remoteAudio = document.getElementById("remote-audio");
                        if (remoteAudio) { 
                            remoteAudio.volume = 1.0;
                            remoteAudio.play().catch(e => console.log("Audio play", e)); 
                        }
                    });

                    vapiInstance.on('speech-start', () => { if (!timerInterval) startTimer(); });

                    vapiInstance.on('track', (track) => {
                        if (track.kind === 'audio') {
                            const remoteAudio = document.getElementById("remote-audio");
                            if (remoteAudio) {
                                remoteAudio.srcObject = new MediaStream([track]);
                                remoteAudio.volume = 1.0;
                                remoteAudio.play().catch(e => console.log("Stream play", e));
                            }
                        }
                    });

                    vapiInstance.on('call-end', () => {
                        stopTimer();
                        endCallUI();
                    });
                }

                if (vapiInstance && typeof vapiInstance.start === 'function') {
                    const now = new Date();
                    const guamTime = new Intl.DateTimeFormat('en-US', { 
                        timeZone: 'Pacific/Guam', 
                        hour: 'numeric', 
                        minute: '2-digit' 
                    }).format(now);

                    vapiInstance.start(VAPI_ASSISTANT_ID, {
                        metadata: {
                            nickname: cachedKakaoNickname,
                            deviceHash: getDeviceHash(),
                            liveGuamTime: guamTime
                        }
                    });
                }
                
                callState = 'ACTIVE';
                document.getElementById("call-status").innerText = "📞 통화가 연결되었습니다.";
                document.getElementById("notice-box").innerHTML = `
                    <div class="info-box-text">
                        <div style="font-size: 13.5px; font-weight: 800; color: #0e2a47;">🔊 스피커폰 통화 (볼륨 조절 가능)</div>
                        <div style="font-size: 12.5px; font-weight: 700; color: #1a3c61; margin-top: 2px;">🎧 이어폰은 통화 시작 전 연결해 주세요!</div>
                    </div>
                `;
                const btn = document.getElementById("action-btn");
                btn.style.backgroundColor = "#e05252";
                btn.style.color = "#ffffff";
                btn.style.boxShadow = "0 6px 16px rgba(224, 82, 82, 0.35)";
                document.getElementById("btn-text-content").innerText = "📞 통화 종료하기";
            } else {
                alert("Vapi SDK 로딩 중입니다. 잠시 후 다시 시도해 주세요.");
            }
        }

        function endCallUI() {
            stopTimer();
            callState = 'ENDED';
            document.getElementById("call-status").innerText = "통화가 종료되었습니다. 수고하셨습니다!";
            document.getElementById("notice-box").innerHTML = `
                <span class="info-box-text" style="font-size: 13.5px; font-weight: 700; color: #1a3c61;">
                    무료 체험에 참여해주셔서 감사합니다!<br>정규 수업 등록 문의는 공식 채널을 이용해 주세요.
                </span>
            `;
            const btn = document.getElementById("action-btn");
            btn.style.backgroundColor = "#a0aec0";
            btn.style.color = "#ffffff";
            btn.style.boxShadow = "none";
            btn.disabled = true;
            document.getElementById("btn-text-content").innerText = "체험 종료됨";
        }
    </script>
</body>
</html>
