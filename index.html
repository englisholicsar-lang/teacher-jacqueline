<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Englisholic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #f4f8ff;
            color: #1e293b;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 140px; /* Extra padding so text never overlaps floating button */
        }

        /* Top Decorative Wave */
        .bg-wave-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 0;
            pointer-events: none;
        }

        /* Bottom Decorative Wave */
        .bg-wave-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 0;
            pointer-events: none;
        }

        /* Dot Grid Accents */
        .dot-grid {
            position: absolute;
            width: 80px;
            height: 80px;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 12px 12px;
            z-index: 1;
            opacity: 0.65;
        }

        .dot-grid-left {
            top: 260px;
            left: 12px;
        }

        .dot-grid-right {
            top: 240px;
            right: 12px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Logo Header */
        .logo-container {
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .logo-img {
            max-width: 210px;
            height: auto;
            display: block;
        }

        /* Profile Card */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 24px rgba(148, 163, 184, 0.25);
            margin-bottom: 14px;
        }

        .teacher-name {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .teacher-subtitle {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        /* Microphone Permission Notice Box */
        .mic-notice-card {
            width: 100%;
            background: #eef5ff;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            padding: 14px 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(219, 234, 254, 0.5);
        }

        .mic-icon {
            font-size: 22px;
            line-height: 1;
        }

        .mic-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #1e40af;
            line-height: 1.4;
            text-align: center;
        }

        /* Instruction Text (Clean line breaks to avoid button touch) */
        .instruction-text {
            font-size: 13.5px;
            color: #475569;
            line-height: 1.6;
            font-weight: 500;
            text-align: center;
            padding: 0 10px;
        }

        .instruction-text strong {
            color: #0f172a;
            font-weight: 700;
        }

        /* Floating Button Container */
        .floating-btn-container {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: 20px;
            z-index: 9999;
        }

        /* Light Blue Shield Button */
        .auth-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background-color: #60a5fa;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.45);
            transition: all 0.3s ease;
            color: #ffffff;
        }

        .auth-btn:active {
            transform: scale(0.92);
        }

        .auth-btn svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .auth-btn:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Hide Vapi call widget initially */
        #vapi-support-button-container, 
        div[id*="vapi"] {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- KakaoTalk In-app Browser External Redirect -->
    <script>
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var url = window.location.href;
            if (ua.indexOf('kakaotalk') !== -1) {
                if (ua.indexOf('android') !== -1) {
                    location.href = 'intent://' + url.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
                } else if (ua.indexOf('iphone') !== -1 || ua.indexOf('ipad') !== -1) {
                    location.href = url + (url.indexOf('?') !== -1 ? '&' : '?') + 'openExternalBrowser=1';
                }
            }
        })();
    </script>

    <!-- Background Waves -->
    <svg class="bg-wave-top" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="#dbeafe" fill-opacity="0.7" d="M0,192L60,181.3C120,171,240,150,360,154.7C480,160,600,192,720,192C840,192,960,160,1080,149.3C1200,139,1320,150,1380,154.7L1440,160L1440,0L0,0Z"></path>
    </svg>

    <svg class="bg-wave-bottom" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="#bfdbfe" fill-opacity="0.6" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,218.7C672,235,768,245,864,224C960,203,1056,149,1152,138.7C1248,128,1344,160,1392,176L1440,192L1440,320L0,320Z"></path>
    </svg>

    <!-- Main Container -->
    <div class="container">
        <div class="dot-grid dot-grid-left"></div>
        <div class="dot-grid dot-grid-right"></div>

        <div class="logo-container">
            <img src="logo.png" alt="Englisholic Innovative English" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/210x50?text=Englisholic';">
        </div>

        <div class="profile-card">
            <img src="jacqueline.png" alt="Teacher Jacqueline" class="avatar-img">
            <h1 class="teacher-name">Teacher Jacqueline</h1>
            <p class="teacher-subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>
        </div>

        <div class="mic-notice-card">
            <span class="mic-icon">🎙️</span>
            <div class="mic-text">
                원활한 통화를 위해 마이크 권한을<br>허용해 주세요.
            </div>
        </div>

        <!-- Instruction Text (Formatted to prevent text-touching issue) -->
        <p class="instruction-text">
            <span style="color:#60a5fa; font-weight:bold;">🛡️ 인증</span> 후 생성되는 📞 <strong>통화 버튼</strong>을 눌러<br>
            Jacqueline 선생님과<br>바로 대화해보세요!
        </p>
    </div>

    <!-- Floating Shield Verification Button -->
    <div class="floating-btn-container" id="auth-container">
        <button id="auth-btn" class="auth-btn" onclick="verifyAndShowPhone()">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWzjwt_EEE4z-4HK0xNc_t5mZ8-tQAiYt0zNUYvh04Klgdb4iRXR092LGn7rcWqCA7HQ/exec";

        async function getDeviceHash() {
            const rawIdentifier = [
                navigator.userAgent,
                screen.width + "x" + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.language
            ].join("|");

            const msgBuffer = new TextEncoder().encode(rawIdentifier);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyAndShowPhone() {
            const authBtn = document.getElementById("auth-btn");
            authBtn.disabled = true;

            try {
                const deviceHash = await getDeviceHash();

                // 1. Check Google Sheet for existing trial
                const checkRes = await fetch(`${GAS_WEB_APP_URL}?deviceHash=${deviceHash}&action=check`);
                const checkResult = await checkRes.json();

                if (checkResult.exists) {
                    alert("무료 체험은 1회만 제공됩니다.");
                    authBtn.disabled = false;
                    return;
                }

                // 2. Log trial
                fetch(`${GAS_WEB_APP_URL}?deviceHash=${deviceHash}&action=log`).catch(e => console.log("Log error:", e));

                // 3. Hide shield button
                document.getElementById("auth-container").style.display = "none";

                // 4. Reveal Vapi Widget using broad selector search
                revealVapiWidget();

                alert("인증되었습니다! 생성된 통화 버튼을 눌러주세요.");

            } catch (err) {
                console.error("Verification error:", err);
                alert("인증 처리 중 오류가 발생했습니다. 다시 시도해주세요.");
                authBtn.disabled = false;
            }
        }

        function revealVapiWidget() {
            // Locate all possible Vapi elements injected by SDK
            const vapiTargets = document.querySelectorAll('#vapi-support-button-container, [class*="vapi"], [id*="vapi"]');
            vapiTargets.forEach(el => {
                el.style.setProperty("display", "block", "important");
                el.style.setProperty("visibility", "visible", "important");
                el.style.setProperty("opacity", "1", "important");
            });
        }
    </script>

    <!-- Official Vapi Web SDK script tag -->
    <script 
        src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"
        data-public-key="6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3"
        data-assistant-id="7b61af6b-87fe-47cb-a37b-f047f5b6fe8c"
        data-position="bottom-right">
    </script>
</body>
</html>
