<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Englisholic - Teacher Jacqueline</title>

  <!-- 카카오톡 인앱 브라우저 외부 브라우저(크롬/사파리)로 자동 연결 -->
  <script>
    (function () {
      var userAgent = navigator.userAgent.toLowerCase();
      if (userAgent.indexOf("kakaotalk") !== -1) {
        var currentUrl = location.href;
        if (userAgent.indexOf("android") !== -1) {
          location.href = "intent://" + currentUrl.replace(/https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
        } else if (userAgent.indexOf("iphone") !== -1 || userAgent.indexOf("ipad") !== -1) {
          location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(currentUrl);
        }
      }
    })();
  </script>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Teacher Jacqueline - 1:1 영어회화">
  <meta property="og:description" content="Jacqueline 선생님과 1:1 영어 회화를 체험해보세요!">
  <meta property="og:image" content="https://englisholicsar-lang.github.io/teacher-jacqueline/jacqueline.png?v=14">
  <meta property="og:url" content="https://englisholicsar-lang.github.io/teacher-jacqueline/">

  <!-- Kakao SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>

  <!-- Vapi 공식 플로팅 위젯 로더 -->
  <script>
    var vapiInstance = null;
    (function (d, t) {
      var g = d.createElement(t),
          s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = function () {
        if (window.vapiSDK) {
          vapiInstance = window.vapiSDK.run({
            apiKey: "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3",
            assistant: "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c",
            config: {
              position: "bottom-right",
              offset: "18px",
              width: "60px",
              height: "60px"
            }
          });
        }
      };
    })(document, "script");
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100vh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4f8ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* 상단 기준으로 정렬하여 하단 공간 확보 */
      position: relative;
      padding-top: 15px;
    }

    /* 상단 배경 웨이브 */
    .bg-wave-top {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 480px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }
    /* 하단 배경 웨이브 */
    .bg-wave-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 480px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }

    /* 측면 도트 패턴 */
    .dot-pattern-left {
      position: absolute;
      left: 10px;
      top: 32%;
      width: 36px;
      height: 70px;
      background-image: radial-gradient(#c2ddff 2.2px, transparent 2.2px);
      background-size: 10px 10px;
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }
    .dot-pattern-right {
      position: absolute;
      right: 10px;
      top: 20%;
      width: 36px;
      height: 70px;
      background-image: radial-gradient(#c2ddff 2.2px, transparent 2.2px);
      background-size: 10px 10px;
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    /* 메인 컨테이너 */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 340px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 12px; /* 간격을 조금 촘촘하게 설정하여 위로 끌어올림 */
      padding: 0 18px;
    }

    /* 브랜드 로고 */
    .logo-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 2px;
    }
    .brand-logo-img {
      width: 155px;
      max-width: 58%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* 아바타 프로필 사진 */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 2px;
    }
    .avatar-wrapper::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(186, 219, 254, 0.65) 0%, rgba(219, 234, 254, 0.15) 70%);
      z-index: -1;
    }
    .avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      box-shadow: 0 6px 18px rgba(11, 26, 62, 0.08);
      display: block;
      background-color: #e2e8f0;
    }

    /* 위로 끌어올린 텍스트 및 안내 박스 구역 */
    .shifted-up-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 10px;
      margin-top: -4px; /* Teacher Jacqueline 줄부터 위로 당김 */
    }

    /* 타이틀 그룹 */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0b1a3e;
      margin: 0 0 2px 0;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }
    .subtitle {
      font-size: 0.78rem;
      font-weight: 400;
      color: #475569;
      margin: 0;
      white-space: nowrap;
    }

    /* 마이크 안내 박스 */
    .mic-notice {
      background-color: #edf4ff;
      border: 1px solid #d0e3ff;
      color: #1e3a8a;
      font-size: 0.76rem;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.35;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .mic-icon {
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .mic-notice-text {
      text-align: center;
    }

    /* 하단 가이드 문구 */
    .guide-text {
      font-size: 0.76rem;
      color: #334155;
      line-height: 1.35;
      margin: 2px 0 0 0;
      text-align: center;
      pointer-events: none; /* 터치 이벤트 방해 금지 */
    }

    /* Vapi 위젯 최상단 유지 */
    iframe[id*="vapi"], div[class*="vapi"], #vapi-widget-container {
      z-index: 999999 !important;
      pointer-events: auto !important;
    }
  </style>
</head>
<body>

  <!-- 상단 배경 웨이브 -->
  <svg class="bg-wave-top" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M150 0C250 80 380 40 500 120V0H150Z" fill="#D2E5FF" fill-opacity="0.75"/>
    <path d="M220 0C320 60 420 30 500 90V0H220Z" fill="#B9D7FF" fill-opacity="0.85"/>
  </svg>

  <!-- 하단 배경 웨이브 -->
  <svg class="bg-wave-bottom" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 180C120 180 220 280 400 240C450 228 480 210 500 200V300H0V180Z" fill="#D2E5FF" fill-opacity="0.75"/>
    <path d="M0 220C100 220 180 290 320 270C380 260 450 230 500 220V300H0V220Z" fill="#A8D0FF" fill-opacity="0.85"/>
  </svg>

  <!-- 도트 패턴 -->
  <div class="dot-pattern-left"></div>
  <div class="dot-pattern-right"></div>

  <div class="container">
    <!-- 브랜드 로고 -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="Englisholic Logo" class="brand-logo-img">
    </div>

    <!-- 선생님 프로필 아바타 -->
    <div class="avatar-wrapper">
      <img src="jacqueline.png" alt="Teacher Jacqueline" class="avatar" loading="eager" decoding="sync">
    </div>

    <!-- Teacher Jacqueline부터 시작하는 구역 전체를 위로 올림 -->
    <div class="shifted-up-content">
      <!-- 타이틀 및 소개 -->
      <div class="text-group">
        <h1>Teacher Jacqueline</h1>
        <p class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>
      </div>

      <!-- 마이크 권한 안내 박스 -->
      <div class="mic-notice">
        <span class="mic-icon">🎙️</span>
        <div class="mic-notice-text">
          원활한 통화를 위해 마이크 권한을<br>허용해 주세요.
        </div>
      </div>

      <!-- 하단 가이드 문구 -->
      <p class="guide-text">
        우측 하단의 📞 <b>통화 버튼</b>을 눌러<br>
        Jacqueline 선생님과 무료 체험 수업을<br>시작하세요!
      </p>
    </div>
  </div>

</body>
</html>
