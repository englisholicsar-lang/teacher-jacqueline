<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Jacqueline - Englisholic</title>
    
    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #f2f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 16px;
            color: #0f172a;
            position: relative;
        }

        /* Top Arched Wave Background Graphic */
        .bg-wave-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background: radial-gradient(ellipse 120% 90% at 50% -20%, #d8ebff 0%, #d8ebff 55%, rgba(216, 235, 255, 0) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Bottom Arched Wave Background Graphic */
        .bg-wave-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: radial-gradient(ellipse 120% 80% at 50% 120%, #d8ebff 0%, #d8ebff 50%, rgba(216, 235, 255, 0) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .main-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Logo Header */
        .logo-box {
            margin-bottom: 12px;
        }

        .logo-box img {
            max-width: 175px;
            height: auto;
            display: block;
        }

        /* Profile & Dot Grids Container */
        .profile-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Smaller Dot Grids Pushed Farther Away */
        .dot-grid-left, .dot-grid-right {
            position: absolute;
            width: 50px;
            height: 70px;
            background-image: radial-gradient(#bcd8f8 1.8px, transparent 1.8px);
            background-size: 7.5px 7.5px;
            opacity: 0.85;
            pointer-events: none;
        }

        .dot-grid-left {
            left: 8px; /* Shifted outward away from photo */
            bottom: -8px;
        }

        .dot-grid-right {
            right: 8px; /* Shifted outward away from photo */
            top: -12px;
        }

        .profile-img-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 4px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(15, 76, 129, 0.16);
        }

        .profile-img-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Typography */
        h1 {
            font-size: 23px;
            font-weight: 800;
            color: #0f2c59;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 14px;
            font-weight: 600;
            color: #526d82;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        /* Microphone Permission Notice Banner */
        .mic-box {
            width: 100%;
            background-color: #f0f7ff;
            border: 1px solid #cbe3ff;
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(15, 76, 129, 0.04);
        }

        .mic-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .mic-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #0f2c59;
            line-height: 1.38;
            text-align: left;
            word-break: keep-all;
        }

        /* Action Buttons with Glowing Soft Shadows */
        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            border: none;
            font-size: 16.5px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            letter-spacing: -0.3px;
            box-shadow: 0 8px 20px rgba(255, 230, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn-kakao {
            background-color: #ffe600;
            color: #191919;
        }

        .btn-kakao:active {
            transform: scale(0.98);
        }

        .btn-kakao.disabled {
            background-color: #ffe600;
            opacity: 0.9;
            cursor: not-allowed;
            box-shadow: 0 6px 16px rgba(255, 230, 0, 0.25);
        }

        .btn-vapi-start {
            background-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
        }

        .btn-vapi-end {
            background-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
        }

        #vapi-container {
            display: none;
            width: 100%;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="bg-wave-top"></div>
    <div class="bg-wave-bottom"></div>

    <div class="main-wrapper">
        <!-- Englisholic Official Logo -->
        <div class="logo-box">
            <img src="./logo.png" alt="Englisholic Innovative English" onerror="this.onerror=null; this.src='logo.jpg';">
        </div>

        <!-- Profile Photo & Outward Dot Grids -->
        <div class="profile-container">
            <div class="dot-grid-left"></div>
            <div class="profile-img-wrap">
                <img src="./jacqueline.png" alt="Teacher Jacqueline" onerror="this.onerror=null; this.src='jacqueline.jpg';">
            </div>
            <div class="dot-grid-right"></div>
        </div>

        <!-- Dynamic Titles -->
        <h1>Teacher Jacqueline</h1>
        <p class="subtitle" id="page-subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>

        <!-- PAGE 1: Kakao Login & Mic Notice -->
        <div id="auth-container" style="width: 100%;">
            <div class="mic-box">
                <span class="mic-icon">🎙️</span>
                <span class="mic-text">원활한 통화를 위해 마이크 권한을 허용해 주세요.</span>
            </div>

            <button id="login-btn" class="btn-action btn-kakao" onclick="loginWithKakao()">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2C5.582 2 2 4.761 2 8.167C2 10.37 3.433 12.301 5.61 13.442L4.84 16.272C4.764 16.549 5.08 16.771 5.318 16.613L8.678 14.38C9.11 14.446 9.551 14.482 10 14.482C14.418 14.482 18 11.721 18 8.315C18 4.761 14.418 2 10 2Z" fill="#191919"/>
                </svg>
                <span id="btn-text-content">카카오로 1초만에 시작하기</span>
            </button>
        </div>

        <!-- PAGE 2: Vapi Call Screen -->
        <div id="vapi-container">
            <button id="call-btn" class="btn-action btn-vapi-start" onclick="toggleCall()">
                <span id="call-btn-text">📞 통화 시작하기</span>
            </button>
            <div id="call-status" class="status-msg">연결 준비 완료</div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby4C0SsERlnAJsjcK3SOUgdqERywyqJB6YyWqTHHRFfbVC3XzXzE_d9mEKJgtb3t_q_jA/exec"; 
        const KAKAO_CLIENT_ID = "6f7519b766b027481f792e3272958dfb";
        const REDIRECT_URI = "https://englisholicsar-lang.github.io";
        const VAPI_PUBLIC_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;
        let isCallActive = false;

        function loginWithKakao() {
            const kakaoAuthUrl = `https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${KAKAO_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = kakaoAuthUrl;
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                document.getElementById("btn-text-content").innerText = "인증 확인 중...";

                let userIdentifier = localStorage.getItem("englisholic_user_id");
                if (!userIdentifier) {
                    userIdentifier = "kakao_user_" + Math.random().toString(36).substring(2, 8);
                    localStorage.setItem("englisholic_user_id", userIdentifier);
                }

                const requestUrl = GAS_URL + "?email=" + encodeURIComponent(userIdentifier) + 
                                   "&userId=" + encodeURIComponent(userIdentifier) + 
                                   "&identifier=" + encodeURIComponent(userIdentifier) + 
                                   "&t=" + Date.now();

                fetch(requestUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ALREADY_USED") {
                            document.getElementById("btn-text-content").innerText = "💬 무료 체험 완료됨";
                            const loginBtn = document.getElementById("login-btn");
                            loginBtn.classList.add("disabled");
                            loginBtn.onclick = function() {
                                alert("이미 무료 체험을 사용하셨습니다.");
                            };
                        } else {
                            document.getElementById("page-subtitle").innerText = "아래 버튼을 눌러 통화를 시작하세요!";
                            document.getElementById("auth-container").style.display = "none";
                            document.getElementById("vapi-container").style.display = "block";
                            initVapi();
                        }
                    })
                    .catch(err => {
                        alert("서버 연결 확인 실패. 다시 시도해 주세요.");
                    });
            }
        };

        function initVapi() {
            if (typeof Vapi !== "undefined") {
                vapiInstance = new Vapi(VAPI_PUBLIC_KEY);

                vapiInstance.on("call-start", () => {
                    isCallActive = true;
                    const callBtn = document.getElementById("call-btn");
                    callBtn.className = "btn-action btn-vapi-end";
                    document.getElementById("call-btn-text").innerText = "🔴 통화 종료하기";
                    document.getElementById("call-status").innerText = "통화 진행 중...";
                });

                vapiInstance.on("call-end", () => {
                    isCallActive = false;
                    const callBtn = document.getElementById("call-btn");
                    callBtn.className = "btn-action btn-vapi-start";
                    document.getElementById("call-btn-text").innerText = "📞 통화 시작하기";
                    document.getElementById("call-status").innerText = "통화가 종료되었습니다.";
                });

                vapiInstance.on("error", (e) => {
                    console.error("Vapi Error:", e);
                    document.getElementById("call-status").innerText = "오류가 발생했습니다. 다시 시도해 주세요.";
                });
            }
        }

        async function toggleCall() {
            if (!vapiInstance) {
                initVapi();
            }

            if (!isCallActive) {
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    vapiInstance.start(VAPI_ASSISTANT_ID);
                } catch (err) {
                    alert("마이크 권한이 필요합니다. 브라우저 설정에서 마이크 사용을 허용해 주세요.");
                }
            } else {
                vapiInstance.stop();
            }
        }
    </script>
</body>
</html>
