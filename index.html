<style>
    /* ... keep all your other existing styles the same ... */

    /* Custom Vibrant Green Call Button */
    .call-btn {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background-color: #22c55e;
        border: none;
        cursor: pointer;
        display: none; /* Revealed upon successful auth */
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(34, 197, 94, 0.45);
        transition: all 0.3s ease;
        color: #ffffff;
    }

    .call-btn:active {
        transform: scale(0.92);
    }

    .call-btn:disabled {
        background-color: #94a3b8; /* Greyed out while loading SDK */
        cursor: not-allowed;
        box-shadow: none;
    }

    .call-btn svg {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
</style>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWzjwt_EEE4z-4HK0xNc_t5mZ8-tQAiYt0zNUYvh04Klgdb4iRXR092LGn7rcWqCA7HQ/exec";
    const VAPI_PUBLIC_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";       
    const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

    let vapiInstance = null;

    // Initialize Vapi client as soon as SDK loads
    window.addEventListener('DOMContentLoaded', () => {
        if (window.vapiSDK) {
            vapiInstance = window.vapiSDK.run({
                apiKey: VAPI_PUBLIC_KEY,
                assistant: VAPI_ASSISTANT_ID
            });
        }
    });

    async function getDeviceHash() {
        const rawIdentifier = [
            navigator.userAgent,
            screen.width + "x" + screen.height,
            screen.colorDepth,
            new Date().getTimezoneOffset(),
            navigator.language
        ].join("|");

        const msgBuffer = new TextEncoder().encode(rawIdentifier);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verifyAndShowPhone() {
        const authBtn = document.getElementById("auth-btn");
        authBtn.disabled = true;

        try {
            const deviceHash = await getDeviceHash();

            const checkRes = await fetch(`${GAS_WEB_APP_URL}?deviceHash=${deviceHash}&action=check`);
            const checkResult = await checkRes.json();

            if (checkResult.exists) {
                alert("무료 체험은 1회만 제공됩니다.");
                authBtn.disabled = false;
                return;
            }

            fetch(`${GAS_WEB_APP_URL}?deviceHash=${deviceHash}&action=log`).catch(e => console.log("Log error:", e));

            // Hide shield, show call button
            authBtn.style.display = "none";
            const callBtn = document.getElementById("call-btn");
            callBtn.style.display = "flex";

            // Verify if SDK is ready
            if (!window.vapiSDK) {
                callBtn.disabled = true;
                alert("통화 모듈을 불러오는 중입니다. 3초 후 다시 시도해주세요.");
                setTimeout(() => {
                    if (window.vapiSDK) callBtn.disabled = false;
                }, 3000);
            }

            alert("인증되었습니다! 생성된 통화 버튼을 눌러주세요.");

        } catch (err) {
            console.error("Verification error:", err);
            alert("인증 처리 중 오류가 발생했습니다. 다시 시도해주세요.");
            authBtn.disabled = false;
        }
    }

    function startVapiCall() {
        if (window.vapiSDK) {
            // If window.vapiSDK.run returns an instance or function, invoke it safely
            if (typeof window.vapiSDK.run === "function") {
                window.vapiSDK.run({
                    apiKey: VAPI_PUBLIC_KEY,
                    assistant: VAPI_ASSISTANT_ID
                });
            }
        } else {
            alert("통화 연결 모듈을 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
        }
    }
</script>
