<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Jacqueline - Free Trial</title>
    
    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        :root {
            --bg-color-top: #e8f3fe;
            --bg-color-bottom: #f2f7fd;
            --primary-navy: #0d2847;
            --sub-navy: #1f3a58;
            --text-muted: #556b82;
            --box-bg: #eaf3ff;
            --box-border: #d2e4f9;
            --kakao-yellow: #fee500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-color-top) 0%, var(--bg-color-bottom) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 20px;
            color: var(--primary-navy);
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-top: 10px;
        }

        /* Englisholic Logo Header */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: radial-gradient(circle at center, #0066b2 0%, #0d2847 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
        }

        .logo-text {
            text-align: left;
        }

        .logo-text-main {
            font-size: 26px;
            font-weight: 800;
            color: #0d2847;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        .logo-text-sub {
            font-size: 13px;
            font-weight: 600;
            color: #1f3a58;
            letter-spacing: 0.2px;
        }

        /* Teacher Profile Avatar */
        .avatar-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(13, 40, 71, 0.12);
        }

        /* Titles */
        .title {
            font-size: 28px;
            font-weight: 800;
            color: #0d2847;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 600;
            color: #4a637d;
            margin-bottom: 24px;
        }

        /* Permission Notice Box */
        .info-box {
            width: 100%;
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .info-box-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .info-box-text {
            font-size: 15px;
            font-weight: 700;
            color: #2b4865;
            line-height: 1.35;
            text-align: center;
        }

        /* Kakao Action Button */
        .kakao-btn {
            width: 100%;
            background-color: var(--kakao-yellow);
            color: #000000;
            border: none;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(254, 229, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .kakao-btn:active {
            transform: scale(0.98);
        }

        .kakao-btn-icon {
            font-size: 20px;
        }

        /* Section Visibility Switches */
        #vapi-container {
            display: none;
            width: 100%;
        }

        .call-btn {
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            border: none;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.4);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- PAGE 1: KAKAO GATE SECTION -->
    <div id="auth-container" class="container">
        <!-- Logo Header -->
        <div class="logo-wrapper">
            <div class="logo-icon">🏛️</div>
            <div class="logo-text">
                <div class="logo-text-main">Englisholic</div>
                <div class="logo-text-sub">Innovative English</div>
            </div>
        </div>

        <!-- Teacher Avatar -->
        <div class="avatar-container">
            <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Teacher Jacqueline">
        </div>

        <!-- Titles -->
        <h1 class="title">Teacher Jacqueline</h1>
        <p class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>

        <!-- Mic Permission Box -->
        <div class="info-box">
            <span class="info-box-icon">🎙️</span>
            <span class="info-box-text">원활한 통화를 위해 마이크 권한을<br>허용해 주세요.</span>
        </div>

        <!-- Yellow Start Button -->
        <button id="login-btn" class="kakao-btn" onclick="startKakaoAuth()">
            <span class="kakao-btn-icon">💬</span>
            <span id="btn-text-content">무료 체험 통화 시작하기</span>
        </button>
    </div>

    <!-- PAGE 2 / 3: TRIAL SECTION (PRESERVED) -->
    <div id="vapi-container" class="container">
        <div class="logo-wrapper">
            <div class="logo-icon">🏛️</div>
            <div class="logo-text">
                <div class="logo-text-main">Englisholic</div>
                <div class="logo-text-sub">Innovative English</div>
            </div>
        </div>

        <div class="avatar-container">
            <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Teacher Jacqueline">
        </div>

        <h1 class="title">Teacher Jacqueline</h1>
        <p id="call-status" class="subtitle">아래 버튼을 눌러 통화를 시작하세요!</p>

        <button id="start-call-btn" class="call-btn" onclick="startVapiCall()">
            📞 통화 시작하기
        </button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby5kz-Y8bNFNVhcSZjhHqPyqzV5JKJRoO-xlhu3jb_VCqnKAz8-ukixS6p0t6Hf6iu52A/exec";
        const REDIRECT_URI = "https://englisholicsar-lang.github.io/teacher-jacqueline/";
        const KAKAO_CLIENT_ID = "4800b51cb8a7d1862dc4b2725633ea69";

        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;

        function startKakaoAuth() {
            const authUrl = "https://kauth.kakao.com/oauth/authorize?client_id=" + KAKAO_CLIENT_ID + 
                            "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) + 
                            "&response_type=code";
            window.location.href = authUrl;
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                document.getElementById("btn-text-content").innerText = "인증 확인 중...";
                
                var userId = "kakao_code_" + authCode.substring(0, 15);
                
                fetch(GAS_URL + "?userId=" + encodeURIComponent(userId) + "&t=" + Date.now())
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ALREADY_USED") {
                            alert("이미 무료 체험을 사용하셨습니다.");
                            document.getElementById("btn-text-content").innerText = "무료 체험 종료됨";
                        } else {
                            document.getElementById("auth-container").style.display = "none";
                            document.getElementById("vapi-container").style.display = "flex";
                        }
                    })
                    .catch(err => {
                        alert("서버 연결 실패");
                    });
            }
        };

        function startVapiCall() {
            if (window.vapiSDK) {
                vapiInstance = window.vapiSDK.run({
                    apiKey: VAPI_KEY,
                    assistant: VAPI_ASSISTANT_ID
                });
                vapiInstance.start(VAPI_ASSISTANT_ID);
                document.getElementById("call-status").innerText = "통화 연결 중...";
            } else {
                alert("Vapi SDK 로딩 실패");
            }
        }
    </script>
</body>
</html>
