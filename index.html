<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- FORCE MOBILE MIC PERMISSIONS -->
    <meta http-equiv="Permissions-Policy" content="microphone=*">
    
    <title>Englisholic - 1:1 Free Trial</title>
    
    <meta property="og:title" content="Englisholic - 1:1 Free Trial">
    <meta property="og:description" content="선생님과의 1:1 맞춤 영어회화 10분 무료 체험">
    <meta property="og:image" content="https://englisholicsar-lang.github.io/teacher-jacqueline/og_preview.png">
    <meta property="og:url" content="https://englisholicsar-lang.github.io/teacher-jacqueline/">
    <meta property="og:type" content="website">

    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>

    <script>
      var vapiInstance = null;
      (function (d, t) {
        var g = d.createElement(t),
            s = d.getElementsByTagName(t)[0];
        g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g, s);
      })(document, "script");
    </script>

    <style>
        :root {
            --bg-base: #f0f6ff;
            --primary-navy: #0e2a47;
            --sub-text: #4a637d;
            --box-bg: #eaf3fe;
            --box-border: #d4e5f9;
            --kakao-yellow: #fee500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background-color: var(--bg-base);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0px 20px 20px 20px;
            color: var(--primary-navy);
        }

        .bg-wave-top, .bg-wave-bottom { position: absolute; width: 100%; max-width: 500px; height: auto; z-index: 0; pointer-events: none; opacity: 0.8; }
        .bg-wave-top { top: 0; right: 0; }
        .bg-wave-bottom { bottom: 0; left: 0; }

        .dot-pattern-left { position: absolute; top: 220px; left: 10px; width: 45px; height: 80px; background-image: radial-gradient(#c2dcfc 2px, transparent 2px); background-size: 10px 10px; z-index: 0; }
        .dot-pattern-right { position: absolute; top: 80px; right: 10px; width: 45px; height: 80px; background-image: radial-gradient(#c2dcfc 2px, transparent 2px); background-size: 10px 10px; z-index: 0; }

        .container { position: relative; z-index: 1; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .upper-group { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 6px; }
        .logo-wrapper { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .logo-img { height: 75px; width: auto; object-fit: contain; }
        .avatar-container { position: relative; width: 115px; height: 115px; margin-bottom: 8px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ffffff; box-shadow: 0 6px 18px rgba(12, 42, 74, 0.12), 0 0 0 6px rgba(255, 255, 255, 0.4); }
        .title { font-size: 22px; font-weight: 800; color: #0c2a4a; margin-bottom: 2px; letter-spacing: -0.3px; }
        .subtitle { font-size: 13.5px; font-weight: 600; color: #4a637d; }

        .timer-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 12px; }
        .timer-display { font-size: 18px; font-weight: 800; color: #0e2a47; background-color: #ffffff; padding: 8px 18px; border-radius: 20px; border: 2px solid #d4e5f9; box-shadow: 0 4px 10px rgba(12, 42, 74, 0.06); display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; }

        .bottom-group { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 24px; }
        .info-box { width: 100%; background-color: var(--box-bg); border: 1px solid var(--box-border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(12, 42, 74, 0.03); }
        
        .action-btn { width: 100%; background-color: var(--kakao-yellow); color: #000000; border: none; padding: 15px 18px; border-radius: 14px; font-size: 16.5px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(254, 229, 0, 0.45); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; }
        .action-btn:disabled { background-color: #a0aec0; box-shadow: none; cursor: not-allowed; color: #ffffff; }

        .shield-icon {
            width: 24px;
            height: 24px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(56, 189, 248, 0.3);
        }
        .shield-icon svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        iframe[title*="vapi"], iframe[src*="vapi"], .vapi-btn { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <svg class="bg-wave-top" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0H500V80C400 140 250 160 0 60V0Z" fill="#dbeafe" fill-opacity="0.7"/>
    </svg>
    <svg class="bg-wave-bottom" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 200H500V120C350 180 150 140 0 200Z" fill="#dbeafe" fill-opacity="0.7"/>
    </svg>

    <div class="dot-pattern-left"></div>
    <div class="dot-pattern-right"></div>

    <audio id="remote-audio" autoplay playsinline controls style="display: none;"></audio>

    <div id="main-container" class="container">
        <div class="upper-group">
            <div class="logo-wrapper">
                <img src="https://englisholicsar-lang.github.io/teacher-jacqueline/logo.png" alt="Englisholic Logo" class="logo-img">
            </div>
            <div class="avatar-container">
                <img class="avatar-img" src="https://englisholicsar-lang.github.io/teacher-jacqueline/jacqueline.png" id="teacher-avatar" alt="Teacher">
            </div>
            <h1 class="title" id="teacher-title">Teacher Jacqueline</h1>
            <p id="call-status" class="subtitle">선생님과의 1:1 맞춤 영어회화</p>
            
            <div id="timer-wrapper" class="timer-wrapper" style="display: none;">
                <div id="timer" class="timer-display">⏱️ 00:00 / 10:00</div>
            </div>
        </div>

        <div class="bottom-group">
            <div id="notice-box" class="info-box" style="flex-direction: column; gap: 10px; padding: 15px 10px;">
                <div style="font-size: 14px; font-weight: 800; color: #0c2a4a; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; white-space: nowrap; letter-spacing: -0.3px;">
                    <span style="font-size: 18px;">🔊</span> 스피커폰으로 기본 설정되었습니다.
                </div>
                <div style="font-size: 14px; font-weight: 800; color: #0c2a4a; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; white-space: nowrap; letter-spacing: -0.3px;">
                    <span style="font-size: 18px;">🎧</span> 이어폰은 통화 시작 전 연결해 주세요!
                </div>
            </div>

            <button id="action-btn" class="action-btn" onclick="handleMainAction()" disabled>
                <div class="shield-icon" id="btn-icon-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <span id="btn-text-content">인증 상태 확인 중...</span>
            </button>
        </div>
    </div>

    <script>
        // --- 1. KAKAO BROWSER BYPASS ---
        // Forces KakaoTalk to explicitly open in the native OS browser (Safari/Chrome)
        const userAgent = navigator.userAgent.toLowerCase();
        if (userAgent.match(/kakaotalk/i)) {
            const currentUrl = encodeURIComponent(window.location.href);
            window.location.href = 'kakaotalk://web/openExternal?url=' + currentUrl;
            setTimeout(() => {
                alert("카카오톡 브라우저에서는 마이크가 제한됩니다. 우측 상단/하단의 메뉴(⋮)를 눌러 '다른 브라우저로 열기(Safari/Chrome)'를 선택해 주세요.");
            }, 600);
        }

        const GAS_URL = "https://script.google.com/macros/s/AKfycbxzTJczMGmbzHOb8J7MzvOPzcposU3eDlVuf6L-EsrCv9moOJrG2x_c7XDxpyO03kQc/exec";
        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";

        let callState = 'IDLE'; 
        let isUserAllowed = false; 
        let timerInterval = null;
        let secondsElapsed = 0;
        
        let sessionData = {
            studentName: "Student",
            teacher: "Jacqueline",
            assistantId: "ab0d16c5-842d-40c6-8fa4-055fee015089",
            coachingNotes: ""
        };

        function getUrlToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get("token") || "";
        }

        function showLockoutUI(message) {
            isUserAllowed = false;
            document.getElementById("main-container").innerHTML = `
                <div class="upper-group" style="margin-top: 10px;">
                    <div class="logo-wrapper">
                        <img src="https://englisholicsar-lang.github.io/teacher-jacqueline/logo.png" alt="Englisholic Logo" class="logo-img">
                    </div>
                    <div class="avatar-container">
                        <img class="avatar-img" src="https://englisholicsar-lang.github.io/teacher-jacqueline/jacqueline.png" alt="Teacher">
                    </div>
                    <h1 class="title">Englisholic</h1>
                    <p class="subtitle">1:1 맞춤 영어회화 무료 체험</p>
                </div>
                <div class="bottom-group" style="margin-top: 20px;">
                    <div class="info-box" style="padding: 16px; justify-content: center;">
                        <span style="text-align: center; color: #0e2a47; font-size: 13.5px; font-weight: 700;">
                            🔒 ${message || "유효하지 않거나 이미 종료된 수업 링크입니다."}
                        </span>
                    </div>
                    <button class="action-btn" onclick="window.location.href='tel:1877-5079'" style="background-color: #10b981; color: #ffffff; box-shadow: 0 4px 12px rgba(16,185,129,0.3); justify-content: center;">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" style="flex-shrink:0;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        <span style="font-size: 17px;">고객센터 문의하기</span>
                    </button>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const token = getUrlToken();
            const btn = document.getElementById("action-btn");

            if (!token) {
                showLockoutUI("접근 권한이 없습니다. 올바른 링크로 접속해 주세요.");
                return;
            }

            fetch(`${GAS_URL}?token=${encodeURIComponent(token)}&t=${Date.now()}`)
                .then(res => res.json())
                .then(result => {
                    if (result && result.allowed === true) {
                        isUserAllowed = true;
                        sessionData.studentName = result.studentName;
                        sessionData.teacher = result.teacher;
                        sessionData.assistantId = result.assistantId;
                        sessionData.coachingNotes = result.coachingNotes;

                        document.getElementById("teacher-title").innerText = "Teacher " + sessionData.teacher;
                        document.getElementById("call-status").innerText = sessionData.studentName + " 회원님, 환영합니다! ✨";

                        btn.removeAttribute("disabled");
                        const iconWrapper = document.getElementById("btn-icon-wrapper");
                        if (iconWrapper) {
                            iconWrapper.className = "";
                            iconWrapper.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="#3A1D1D" style="flex-shrink:0;"><path d="M12 3c-5.52 0-10 3.58-10 8 0 2.61 1.54 4.92 3.86 6.36l-1.2 4.39c-.11.41.34.74.69.5l4.13-2.73c.8.22 1.65.34 2.52.34 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/></svg>`;
                        }
                        document.getElementById("btn-text-content").innerText = "무료 체험 수업 시작하기";
                    } else {
                        showLockoutUI(result.message || "만료되었거나 유효하지 않은 링크입니다.");
                    }
                })
                .catch(err => {
                    console.error("Token verification error:", err);
                    showLockoutUI("서버 통신 중 오류가 발생했습니다.");
                });
        });

        function handleMainAction() {
            if (!isUserAllowed) return;

            if (callState === 'IDLE') {
                const btn = document.getElementById("action-btn");
                btn.setAttribute("disabled", "true");
                document.getElementById("btn-text-content").innerText = "마이크 권한 요청 중...";

                const remoteAudio = document.getElementById("remote-audio");
                if (remoteAudio) {
                    remoteAudio.volume = 1.0;
                    remoteAudio.play().catch(e => {});
                }

                // 2. EXPLICIT MIC REQUEST TO BLOCK UI FROM ADVANCING FALSELY
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then((stream) => {
                        // Mic granted! Release hardware back to Vapi SDK
                        stream.getTracks().forEach(track => track.stop());
                        document.getElementById("btn-text-content").innerText = "통화 연결 중...";
                        
                        startVapiCall();
                    })
                    .catch((err) => {
                        console.error("Mic access denied:", err);
                        alert("원활한 수업을 위해 마이크 권한이 반드시 필요합니다. 브라우저 설정에서 마이크를 허용해 주세요.");
                        btn.removeAttribute("disabled");
                        document.getElementById("btn-text-content").innerText = "무료 체험 수업 시작하기";
                    });

            } else if (callState === 'ACTIVE') {
                endCallUI();
            }
        }

        function startVapiCall() {
            try {
                if (window.vapiSDK && typeof window.vapiSDK.run === 'function') {
                    vapiInstance = window.vapiSDK.run({
                        apiKey: VAPI_KEY, 
                        assistant: sessionData.assistantId, 
                        config: {} 
                    });
                    
                    if (vapiInstance) {
                        if (typeof vapiInstance.start === 'function') {
                            vapiInstance.start(sessionData.assistantId, { 
                                variableValues: { 
                                    student_name: sessionData.studentName, 
                                    teacher_name: sessionData.teacher,
                                    token: getUrlToken() 
                                },
                                metadata: {
                                    token: getUrlToken(),
                                    studentName: sessionData.studentName
                                },
                                assistantOverrides: {
                                    model: {
                                        messages: [
                                            {
                                                role: "system",
                                                content: "You are " + sessionData.teacher + ", a certified native English instructor at Englisholic. You are conducting a 1:1 trial lesson with " + sessionData.studentName + ". Context/Notes for this student: " + sessionData.coachingNotes
                                            }
                                        ]
                                    }
                                }
                            });
                        }

                        if (typeof vapiInstance.on === 'function') {
                            vapiInstance.on('call-start', activateCallUI);
                            vapiInstance.on('call-end', endCallUI);
                            vapiInstance.on('track', (track, stream) => { 
                                if (track.kind === 'audio') { 
                                    const remoteAudio = document.getElementById("remote-audio"); 
                                    if (remoteAudio) { 
                                        remoteAudio.srcObject = stream || new MediaStream([track]); 
                                        remoteAudio.muted = false; 
                                        remoteAudio.volume = 1.0; 
                                        const playPromise = remoteAudio.play();
                                        if (playPromise !== undefined) {
                                            playPromise.catch(e => console.log("Stream play error:", e));
                                        }
                                    } 
                                } 
                            });
                        }
                    }
                }
            } catch (err) { 
                alert("통화 연결 중 오류가 발생했습니다. 다시 시도해 주세요."); 
                const btn = document.getElementById("action-btn");
                btn.removeAttribute("disabled"); 
                document.getElementById("btn-text-content").innerText = "무료 체험 수업 시작하기"; 
            }
        }

        function activateCallUI() {
            if (callState === 'ACTIVE') return;
            callState = 'ACTIVE';
            
            try { startTimer(); } catch(e) {}
            
            try {
                document.getElementById("call-status").innerText = "📞 통화가 연결되었습니다.";
                document.getElementById("notice-box").innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; width: 100%; gap: 12px;">
                        <div style="font-size: 24px; flex-shrink: 0;">🎙️</div>
                        <span style="text-align: left; font-size: 15px; font-weight: 800; color: #0e2a47; line-height: 1.4;">
                            마이크 권한을 허용해 주세요.
                        </span>
                    </div>`;
                
                const btn = document.getElementById("action-btn");
                btn.style.backgroundColor = "#e05252";
                btn.style.boxShadow = "0 6px 16px rgba(224, 82, 82, 0.35)"; 
                btn.removeAttribute("disabled"); 
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="#ffffff" style="flex-shrink:0;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    <span id="btn-text-content">통화 종료하기</span>
                `;
            } catch(e) { console.error("UI 변경 중 에러 발생", e); }
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById("timer-wrapper").style.display = "flex";

            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById("timer").innerText = "⏱️ " + formatTime(secondsElapsed) + " / 10:00";
                
                if (secondsElapsed === 300) {  
                    if (vapiInstance && typeof vapiInstance.send === 'function') {
                        vapiInstance.send({ type: "add-message", message: { role: "system", content: "[SYSTEM TIME CHECK: 5 MINUTES ELAPSED. 5 MINUTES REMAINING.]" }});
                    }
                }

                if (secondsElapsed === 570) {  
                    if (vapiInstance && typeof vapiInstance.send === 'function') {
                        vapiInstance.send({ type: "add-message", message: { role: "system", content: "[CRITICAL SYSTEM ALERT: 9:30 REACHED. YOU MUST IMMEDIATELY CEASE NEW TOPICS, DELIVER A WARM 50-WORD CLOSING, AND PREPARE TO END THE SESSION.]" }});
                    }
                }

                if (secondsElapsed === 585) {  
                    if (vapiInstance && typeof vapiInstance.send === 'function') {
                        vapiInstance.send({ type: "add-message", message: { role: "system", content: "[CRITICAL SYSTEM ALERT: 10 MINUTES REACHED. YOU MUST IMMEDIATELY SAY GOODBYE AND EXECUTE THE end_tutoring_session TOOL IN YOUR VERY NEXT TURN.]" }});
                    }
                }

                if (secondsElapsed >= 600) {  
                    endCallUI();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function sendFrontendCompletion(durationSec) {
            const payload = {
                type: "frontend-completion",
                token: getUrlToken(),
                studentName: sessionData.studentName,
                duration: durationSec
            };
            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Frontend completion sync error:", err));
        }

        function endCallUI() {
            if (callState === 'ENDED') return;
            stopTimer();
            if (vapiInstance && typeof vapiInstance.stop === 'function') {
                try { vapiInstance.stop(); } catch(e) {}
            }
            callState = 'ENDED';
            
            // 3. TIMER CLEANUP: Hide the stopwatch cleanly
            document.getElementById("timer-wrapper").style.display = "none";
            document.getElementById("call-status").innerText = "통화가 종료되었습니다. 수고하셨습니다!";
            
            document.getElementById("notice-box").innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; text-align: center;">
                    <div style="font-size: 13.5px; font-weight: 800; color: #0e2a47;">🚀 무료 체험에 참여해 주셔서 감사합니다!</div>
                    <div style="font-size: 13px; font-weight: 700; color: #1a3c61;">수업 문의는 아래 고객센터 버튼을 눌러 주세요.</div>
                </div>
            `;
            
            const btn = document.getElementById("action-btn");
            btn.style.backgroundColor = "#10b981";
            btn.style.color = "#ffffff";
            btn.style.boxShadow = "0 4px 12px rgba(16,185,129,0.3)";
            btn.removeAttribute("disabled");
