<script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyrYTZ4vQQaVkryF70yqumB-aUF7Hk4wdmDbdNT0_MTCLiUycH28A_sPVieQL4h4fgsYw/exec";
        const KAKAO_CLIENT_ID = "4800b51cb8a7d1862dc4b2725633ea69";

        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;
        let isCallActive = false;
        let timerInterval = null;
        let secondsElapsed = 0;
        const MAX_SECONDS = 600;

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (typeof Kakao !== "undefined" && !Kakao.isInitialized()) {
                    Kakao.init(KAKAO_CLIENT_ID);
                }
            } catch (e) {}
        });

        function startKakaoAuth() {
            try {
                if (typeof Kakao === "undefined" || !Kakao.isInitialized()) {
                    Kakao.init(KAKAO_CLIENT_ID);
                }
            } catch(e) {}

            const btnText = document.getElementById("btn-text-content");
            if (btnText) btnText.innerText = "카카오 로그인 중...";

            const showCallScreen = () => {
                const authEl = document.getElementById("auth-container");
                const vapiEl = document.getElementById("vapi-container");
                if (authEl) authEl.style.display = "none";
                if (vapiEl) vapiEl.style.display = "flex";
            };

            try {
                Kakao.Auth.login({
                    throughTalk: false,
                    success: function(authObj) {
                        if (btnText) btnText.innerText = "인증 확인 중...";

                        Kakao.API.request({
                            url: '/v2/user/me',
                            success: function(res) {
                                const userId = res.id;
                                let userName = "Kakao User";
                                
                                if (res.properties && res.properties.nickname) {
                                    userName = res.properties.nickname;
                                } else if (res.kakao_account && res.kakao_account.profile && res.kakao_account.profile.nickname) {
                                    userName = res.kakao_account.profile.nickname;
                                }

                                const isKoreanName = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(userName);
                                window.authenticatedUserName = isKoreanName ? "KOREAN_NAME_DETECTED" : userName;

                                const callbackName = "gasCallback_" + Date.now();
                                const fallbackTimer = setTimeout(() => {
                                    showCallScreen();
                                }, 3000);

                                window[callbackName] = function(data) {
                                    clearTimeout(fallbackTimer);
                                    delete window[callbackName];
                                    const scriptEl = document.getElementById(callbackName);
                                    if (scriptEl) scriptEl.remove();

                                    if (data && data.status === "ALREADY_USED") {
                                        alert("이미 무료 체험을 사용하셨습니다.");
                                        if (btnText) btnText.innerText = "무료 체험 완료됨";
                                    } else {
                                        showCallScreen();
                                    }
                                };

                                const script = document.createElement('script');
                                script.id = callbackName;
                                script.src = GAS_URL + "?userId=" + encodeURIComponent(userId) + 
                                                       "&userName=" + encodeURIComponent(userName) + 
                                                       "&callback=" + callbackName + 
                                                       "&t=" + Date.now();

                                script.onerror = function() {
                                    clearTimeout(fallbackTimer);
                                    showCallScreen();
                                };

                                document.body.appendChild(script);
                            },
                            fail: function(error) {
                                showCallScreen();
                            }
                        });
                    },
                    fail: function(err) {
                        if (btnText) btnText.innerText = "무료 체험 통화 시작하기";
                        showCallScreen();
                    }
                });
            } catch (ex) {
                showCallScreen();
            }
        }

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            secondsElapsed = 0;
            
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const timerEl = document.getElementById("timer");
                if (timerEl) {
                    timerEl.innerText = "⏱️ " + formatTime(secondsElapsed) + " / 10:00";
                }

                if (secondsElapsed >= MAX_SECONDS) {
                    stopTimer();
                    if (vapiInstance && typeof vapiInstance.stop === 'function') {
                        vapiInstance.stop();
                    }
                    isCallActive = false;
                    const statusEl = document.getElementById("call-status");
                    if (statusEl) statusEl.innerText = "10분 무료 체험이 종료되었습니다.";
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function toggleVapiCall() {
            if (!isCallActive) {
                try {
                    const vapiSdkObj = window.vapi || window.vapiSDK;

                    if (vapiSdkObj) {
                        vapiInstance = vapiSdkObj;

                        // 🌺 FORCE TRIGGER TIMER & UI IMMEDIATELY ON BUTTON TAP
                        startTimer();
                        isCallActive = true;

                        const statusEl = document.getElementById("call-status");
                        const btnTextEl = document.getElementById("call-btn-text");
                        const btnEl = document.getElementById("start-call-btn");

                        if (statusEl) statusEl.innerText = "🔊 통화가 연결되었습니다.";
                        if (btnTextEl) btnTextEl.innerText = "🚫 전화 끊기";
                        if (btnEl) {
                            btnEl.style.backgroundColor = "#e05252";
                            btnEl.style.boxShadow = "0 6px 16px rgba(224, 82, 82, 0.35)";
                        }

                        // RUN VAPI CALL
                        if (typeof vapiInstance.run === 'function') {
                            vapiInstance.run({
                                apiKey: VAPI_KEY,
                                assistant: VAPI_ASSISTANT_ID,
                                assistantOverrides: {
                                    variableValues: {
                                        studentName: window.authenticatedUserName || "Student"
                                    }
                                }
                            });
                        }
                    } else {
                        alert("Vapi SDK가 로딩되지 않았습니다. 새로고침 해주세요.");
                    }
                } catch (err) {
                    console.error("Vapi call execution error:", err);
                    alert("통화 연결 중 오류가 발생했습니다.");
                }
            } else {
                try {
                    if (vapiInstance && typeof vapiInstance.stop === 'function') {
                        vapiInstance.stop();
                    }
                } catch(e) {}
                
                stopTimer();
                isCallActive = false;

                const statusEl = document.getElementById("call-status");
                const btnTextEl = document.getElementById("call-btn-text");
                const btnEl = document.getElementById("start-call-btn");

                if (statusEl) statusEl.innerText = "통화가 종료되었습니다.";
                if (btnTextEl) btnTextEl.innerText = "통화 종료됨";
                if (btnEl) {
                    btnEl.style.backgroundColor = "#a0aec0";
                    btnEl.disabled = true;
                }
            }
        }
    </script>
