<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Jacqueline - Englisholic</title>
    
    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #eef7ff;
            background-image: 
                radial-gradient(#cce3f7 1.5px, transparent 1.5px),
                radial-gradient(#cce3f7 1.5px, #eef7ff 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            padding: 28px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-img {
            height: 48px;
            object-fit: contain;
        }

        .profile-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 18px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            line-height: 1.4;
            margin-bottom: 22px;
            letter-spacing: -0.3px;
        }

        /* Mic Helper Notice Box */
        .mic-notice {
            background-color: #f0f7ff;
            border: 1px solid #d0e4ff;
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            text-align: left;
        }

        .mic-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .mic-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #1e3a8a;
            line-height: 1.35;
            word-break: keep-all;
        }

        /* Common Button Styles */
        .btn {
            width: 100%;
            padding: 18px 20px;
            border-radius: 20px;
            border: none;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: -0.3px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        /* Kakao Yellow Button */
        .btn-kakao {
            background-color: #FFE600;
            color: #191919;
        }

        .btn-kakao:active {
            transform: scale(0.98);
            background-color: #fada00;
        }

        .btn-kakao.disabled {
            background-color: #FFE600;
            opacity: 0.85;
            cursor: not-allowed;
        }

        /* Vapi Call Buttons */
        .btn-vapi-start {
            background-color: #22c55e;
            color: #ffffff;
        }

        .btn-vapi-start:active {
            transform: scale(0.98);
            background-color: #16a34a;
        }

        .btn-vapi-end {
            background-color: #ef4444;
            color: #ffffff;
        }

        .btn-vapi-end:active {
            transform: scale(0.98);
            background-color: #dc2626;
        }

        #vapi-container {
            display: none;
            width: 100%;
        }

        .call-status {
            margin-top: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Englisholic Brand Header -->
        <div class="logo-container">
            <svg width="180" height="42" viewBox="0 0 200 48" fill="none" class="logo-img">
                <circle cx="24" cy="24" r="20" fill="#0F4C81"/>
                <path d="M14 34V31H34V34H14ZM16 30V18H19V30H16ZM22.5 30V18H25.5V30H22.5ZM29 30V18H32V30H29ZM14 17V14H34V17H14Z" fill="#FFFFFF"/>
                <text x="50" y="24" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" fill="#0F4C81">Englisholic</text>
                <text x="50" y="38" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#475569" letter-spacing="0.5">Innovative English</text>
            </svg>
        </div>

        <!-- Jacqueline Profile Photo -->
        <div class="profile-wrapper">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=300" alt="Teacher Jacqueline" class="profile-img">
        </div>

        <!-- Dynamic Title & Subtitle -->
        <h1 id="page-title">Teacher Jacqueline</h1>
        <p class="subtitle" id="page-subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>

        <!-- PAGE 1: Kakao Verification Gate -->
        <div id="auth-container">
            <!-- Microphone Notice Box -->
            <div class="mic-notice">
                <span class="mic-icon">🎙️</span>
                <span class="mic-text">원활한 통화를 위해 마이크 권한을 허용해 주세요.</span>
            </div>

            <!-- Kakao Button -->
            <button id="login-btn" class="btn btn-kakao" onclick="loginWithKakao()">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2C5.582 2 2 4.761 2 8.167C2 10.37 3.433 12.301 5.61 13.442L4.84 16.272C4.764 16.549 5.08 16.771 5.318 16.613L8.678 14.38C9.11 14.446 9.551 14.482 10 14.482C14.418 14.482 18 11.721 18 8.315C18 4.761 14.418 2 10 2Z" fill="#191919"/>
                </svg>
                <span id="btn-text-content">카카오로 1초만에 시작하기</span>
            </button>
        </div>

        <!-- PAGE 2: Active Vapi Call Screen -->
        <div id="vapi-container">
            <button id="call-btn" class="btn btn-vapi-start" onclick="toggleCall()">
                <span id="call-btn-text">📞 통화 시작하기</span>
            </button>
            <div id="call-status" class="call-status">연결 준비 완료</div>
        </div>
    </div>

    <script>
        // CONFIGURATION (PERSISTED KEYS)
        const GAS_URL = "https://script.google.com/macros/s/AKfycby4C0SsERlnAJsjcK3SOUgdqERywyqJB6YyWqTHHRFfbVC3XzXzE_d9mEKJgtb3t_q_jA/exec"; 
        const KAKAO_CLIENT_ID = "6f7519b766b027481f792e3272958dfb";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const VAPI_PUBLIC_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;
        let isCallActive = false;

        // Step 1: Initialize Kakao Login Redirect
        function loginWithKakao() {
            const kakaoAuthUrl = `https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${KAKAO_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = kakaoAuthUrl;
        }

        // Step 2: Handle Redirect and Check Session in Google Sheets
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                document.getElementById("btn-text-content").innerText = "인증 확인 중...";

                let userIdentifier = localStorage.getItem("englisholic_user_id");
                if (!userIdentifier) {
                    userIdentifier = "kakao_user_" + Math.random().toString(36).substring(2, 8);
                    localStorage.setItem("englisholic_user_id", userIdentifier);
                }

                const requestUrl = GAS_URL + "?email=" + encodeURIComponent(userIdentifier) + 
                                   "&userId=" + encodeURIComponent(userIdentifier) + 
                                   "&identifier=" + encodeURIComponent(userIdentifier) + 
                                   "&t=" + Date.now();

                fetch(requestUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "ALREADY_USED") {
                            // USED STATE: Update yellow button to "무료 체험 완료됨"
                            document.getElementById("btn-text-content").innerText = "💬 무료 체험 완료됨";
                            const loginBtn = document.getElementById("login-btn");
                            loginBtn.classList.add("disabled");
                            loginBtn.onclick = function() {
                                alert("이미 무료 체험을 사용하셨습니다.");
                            };
                        } else {
                            // SUCCESS: Transition to Page 2 layout
                            document.getElementById("page-subtitle").innerText = "아래 버튼을 눌러 통화를 시작하세요!";
                            document.getElementById("auth-container").style.display = "none";
                            document.getElementById("vapi-container").style.display = "block";
                            initVapi();
                        }
                    })
                    .catch(err => {
                        alert("서버 연결 확인 실패. 다시 시도해 주세요.");
                    });
            }
        };

        // Step 3: Vapi Web SDK Handlers
        function initVapi() {
            if (typeof Vapi !== "undefined") {
                vapiInstance = new Vapi(VAPI_PUBLIC_KEY);

                vapiInstance.on("call-start", () => {
                    isCallActive = true;
                    const callBtn = document.getElementById("call-btn");
                    callBtn.className = "btn btn-vapi-end";
                    document.getElementById("call-btn-text").innerText = "🔴 통화 종료하기";
                    document.getElementById("call-status").innerText = "통화 진행 중...";
                });

                vapiInstance.on("call-end", () => {
                    isCallActive = false;
                    const callBtn = document.getElementById("call-btn");
                    callBtn.className = "btn btn-vapi-start";
                    document.getElementById("call-btn-text").innerText = "📞 통화 시작하기";
                    document.getElementById("call-status").innerText = "통화가 종료되었습니다.";
                });

                vapiInstance.on("error", (e) => {
                    console.error("Vapi Error:", e);
                    document.getElementById("call-status").innerText = "오류가 발생했습니다. 다시 시도해 주세요.";
                });
            }
        }

        // Step 4: Toggle Call State
        async function toggleCall() {
            if (!vapiInstance) {
                initVapi();
            }

            if (!isCallActive) {
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    vapiInstance.start(VAPI_ASSISTANT_ID);
                } catch (err) {
                    alert("마이크 권한이 필요합니다. 브라우저 설정에서 마이크 사용을 허용해 주세요.");
                }
            } else {
                vapiInstance.stop();
            }
        }
    </script>
</body>
</html>
