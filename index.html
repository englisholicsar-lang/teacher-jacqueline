<script>
    // Initialize Vapi SDK
    const vapiApiKey = '6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3'; 
    const assistantId = '7b61af6b-87fe-47cb-a37b-f047f5b6fe8c';
    
    let vapiInstance = null;

    if (window.vapiSDK) {
      vapiInstance = window.vapiSDK.run({
        apiKey: vapiApiKey,
      });
    }

    // Ensure Kakao SDK is initialized safely once loaded
    window.addEventListener('load', function() {
      if (typeof Kakao !== 'undefined') {
        if (!Kakao.isInitialized()) {
          Kakao.init('adad030abdf866a8b3be558c979ddb03');
          console.log("Kakao SDK Initialized successfully.");
        }
      } else {
        console.error("Kakao SDK failed to load from CDN.");
      }
    });

    // Direct Popup Login with Safety Guard
    function startKakaoTrial() {
      const statusDiv = document.getElementById('status');

      if (typeof Kakao === 'undefined') {
        statusDiv.innerText = "Kakao SDK 로딩 중입니다. 잠시 후 다시 시도해 주세요.";
        alert("Kakao SDK가 아직 로드되지 않았습니다. 잠시만 기다려주세요.");
        return;
      }

      if (!Kakao.isInitialized()) {
        Kakao.init('adad030abdf866a8b3be558c979ddb03');
      }

      statusDiv.innerText = "카카오 로그인 창을 여는 중...";

      Kakao.Auth.login({
        success: function(authObj) {
          statusDiv.innerText = "로그인 성공! 프로필 확인 중...";
          
          Kakao.API.request({
            url: '/v2/user/me',
            success: function(res) {
              const kakaoUserId = res.id;
              statusDiv.innerText = "인증 완료! 통화 연결 중...";
              startVapiCall(kakaoUserId);
            },
            fail: function(error) {
              statusDiv.innerText = "프로필 정보를 가져오지 못했습니다.";
            }
          });
        },
        fail: function(err) {
          statusDiv.innerText = "카카오 로그인이 취소되었거나 실패했습니다.";
        }
      });
    }

    // Start Vapi Call
    function startVapiCall(userId) {
      if (!vapiInstance) {
        alert("Vapi SDK가 아직 로드되지 않았습니다.");
        return;
      }

      vapiInstance.start(assistantId);

      setTimeout(() => {
        if (vapiInstance) {
          vapiInstance.send({
            type: 'add-message',
            message: {
              role: 'system',
              content: 'Please let the user know we have 1 minute remaining in our trial lesson and start wrapping up smoothly.'
            }
          });
        }
      }, 540000);
    }
  </script>
