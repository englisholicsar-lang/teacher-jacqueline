  <!-- ⚡ KAKAOTALK AUTO-REDIRECT (IMMEDIATE HEAD EXECUTION) -->
  <script>
    (function forceExternalBrowser() {
      var ua = navigator.userAgent.toLowerCase();
      var isKakao = ua.indexOf('kakaotalk') > -1;

      if (isKakao) {
        var rawUrl = window.location.href;
        var cleanUrl = rawUrl.replace(/^https?:\/\//, '');

        if (ua.indexOf('android') > -1) {
          // Launch Google Chrome directly via Android Intent
          window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end;';
        } else if (ua.indexOf('iphone') > -1 || ua.indexOf('ipad') > -1 || ua.indexOf('ipod') > -1) {
          // Launch Safari directly via KakaoTalk external protocol
          window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(rawUrl);
        }
      }
    })();
  </script>
