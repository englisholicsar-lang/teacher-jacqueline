<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Jacqueline - Free Trial (Diagnostic)</title>

    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f0f6ff;
            color: #0e2a47;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #fee500;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        #debug-log {
            width: 100%;
            height: 250px;
            background: #1e1e1e;
            color: #00ff66;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            overflow-y: auto;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>Teacher Jacqueline Test</h2>
    <p id="status-text">Ready to test</p>

    <button id="test-btn" class="btn" onclick="runDiagnosticTest()">🧪 Run Call Diagnostic</button>

    <h3>Live Debug Console:</h3>
    <div id="debug-log">-- Debug Log Started --\n</div>

    <script>
        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        function log(msg) {
            const consoleEl = document.getElementById("debug-log");
            if (consoleEl) {
                consoleEl.innerText += "[" + new Date().toLocaleTimeString() + "] " + msg + "\n";
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
            console.log(msg);
        }

        async function runDiagnosticTest() {
            log("1. Tap detected.");

            // Step 1: Check Mic
            try {
                log("2. Requesting mic stream...");
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log("3. Mic granted! Tracks count: " + stream.getAudioTracks().length);
                stream.getTracks().forEach(t => t.stop());
            } catch (err) {
                log("❌ Mic Error: " + err.message);
                return;
            }

            // Step 2: Inspect Vapi SDK Object
            const vapiSdk = window.vapi || window.vapiSDK;
            if (!vapiSdk) {
                log("❌ Vapi SDK not found on window object!");
                return;
            }

            log("4. Vapi SDK detected. Available keys: " + Object.keys(vapiSdk).join(", "));

            // Step 3: Attach Event Listeners
            if (typeof vapiSdk.on === 'function') {
                vapiSdk.on('call-start', () => log("🟢 EVENT: call-start"));
                vapiSdk.on('call-end', () => log("🔴 EVENT: call-end"));
                vapiSdk.on('speech-start', () => log("🗣️ EVENT: Jacqueline speech started!"));
                vapiSdk.on('error', (e) => log("❌ EVENT Error: " + JSON.stringify(e)));
            }

            // Step 4: Execute Launch Test
            try {
                log("5. Initializing call via .run()...");
                document.getElementById("status-text").innerText = "Connecting...";

                if (typeof vapiSdk.run === 'function') {
                    vapiSdk.run({
                        apiKey: VAPI_KEY,
                        assistant: VAPI_ASSISTANT_ID
                    });
                    log("6. .run() invoked successfully.");
                } else if (typeof vapiSdk.start === 'function') {
                    vapiSdk.start(VAPI_ASSISTANT_ID);
                    log("6. .start() invoked successfully.");
                } else {
                    log("❌ Neither .run() nor .start() exists on vapi object.");
                }
            } catch (err) {
                log("❌ Launch Error: " + err.message);
            }
        }
    </script>
</body>
</html>
