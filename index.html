<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Jacqueline - Free Trial</title>
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Teacher Jacqueline - Free Trial">
    <meta property="og:description" content="재클린 선생님과의 1:1 맞춤 영어회화 10분 무료 체험">
    <meta property="og:image" content="https://englisholicsar-lang.github.io/teacher-jacqueline/og_preview.png">
    <meta property="og:url" content="https://englisholicsar-lang.github.io/teacher-jacqueline/">
    <meta property="og:type" content="website">

    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <style>
        :root {
            --bg-base: #f0f6ff;
            --primary-navy: #0e2a47;
            --sub-text: #4a637d;
            --box-bg: #eaf3fe;
            --box-border: #d4e5f9;
            --kakao-yellow: #fee500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background-color: var(--bg-base);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0px 20px 20px 20px;
            color: var(--primary-navy);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 20px;
        }

        .upper-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .logo-wrapper {
            margin-bottom: 8px;
        }

        .logo-img {
            height: 75px;
            width: auto;
            object-fit: contain;
        }

        .avatar-container {
            width: 115px;
            height: 115px;
            margin-bottom: 8px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 6px 18px rgba(12, 42, 74, 0.12);
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            color: #0c2a4a;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 13.5px;
            font-weight: 600;
            color: #4a637d;
        }

        .timer-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 12px;
        }

        .timer-display {
            font-size: 18px;
            font-weight: 800;
            color: #0e2a47;
            background-color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            border: 2px solid #d4e5f9;
            box-shadow: 0 4px 10px rgba(12, 42, 74, 0.06);
        }

        .bottom-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 24px;
        }

        .info-box {
            width: 100%;
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .info-box-icon {
            font-size: 24px;
        }

        .info-box-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #1a3c61;
            text-align: left;
            line-height: 1.28;
        }

        .main-action-btn {
            width: 100%;
            background-color: var(--kakao-yellow);
            color: #000000;
            border: none;
            padding: 16px 18px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(254, 229, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- Hidden audio element for WebRTC audio context unlock -->
    <audio id="webview-audio-unlock" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" preload="auto" playsinline></audio>

    <div class="container">
        <div class="upper-group">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Englisholic Logo" class="logo-img">
            </div>
            <div class="avatar-container">
                <img class="avatar-img" src="jacqueline.png" alt="Teacher Jacqueline">
            </div>
            <h1 class="title">Teacher Jacqueline</h1>
            <p id="call-status" class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>

            <div class="timer-wrapper">
                <div id="timer" class="timer-display">⏱️ 00:00 / 10:00</div>
            </div>
        </div>

        <div class="bottom-group">
            <div id="info-box-wrapper" class="info-box">
                <span class="info-box-icon">🎙️</span>
                <span class="info-box-text">원활한 통화를 위해 마이크 권한을<br>허용해 주세요.</span>
            </div>

            <button id="action-btn" class="main-action-btn" onclick="handleButtonClick()">
                <span>💬</span>
                <span id="btn-text">무료 체험 통화 시작하기</span>
            </button>
        </div>
    </div>

    <script>
        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        let vapiInstance = null;
        let flowStage = "START"; // START -> VERIFYING -> READY -> IN_CALL -> ENDED
        let timerInterval = null;
        let secondsElapsed = 0;
        const MAX_SECONDS = 600;

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            secondsElapsed = 0;
            
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const timerEl = document.getElementById("timer");
                if (timerEl) {
                    timerEl.innerText = "⏱️ " + formatTime(secondsElapsed) + " / 10:00";
                }

                if (secondsElapsed >= MAX_SECONDS) {
                    stopTimer();
                    if (vapiInstance && typeof vapiInstance.stop === 'function') {
                        vapiInstance.stop();
                    }
                    setUIEnded("10분 무료 체험이 종료되었습니다.");
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function unlockWebViewAudio() {
            const audioEl = document.getElementById("webview-audio-unlock");
            if (audioEl) {
                audioEl.play().then(() => audioEl.pause()).catch(() => {});
            }
        }

        function setUIReady() {
            flowStage = "READY";
            const statusEl = document.getElementById("call-status");
            const btnTextEl = document.getElementById("btn-text");
            const btnEl = document.getElementById("action-btn");

            if (statusEl) statusEl.innerText = "아래 버튼을 눌러 통화를 시작하세요!";
            if (btnTextEl) btnTextEl.innerText = "📞 통화 시작하기";
            if (btnEl) {
                btnEl.style.backgroundColor = "#2ecc71";
                btnEl.style.color = "#ffffff";
                btnEl.style.boxShadow = "0 6px 16px rgba(46, 204, 113, 0.4)";
                btnEl.disabled = false;
            }
        }

        function setUIInCall() {
            flowStage = "IN_CALL";
            const statusEl = document.getElementById("call-status");
            const btnTextEl = document.getElementById("btn-text");
            const btnEl = document.getElementById("action-btn");

            if (statusEl) statusEl.innerText = "🔊 통화가 연결되었습니다.";
            if (btnTextEl) btnTextEl.innerText = "🚫 통화 종료하기";
            if (btnEl) {
                btnEl.style.backgroundColor = "#e05252";
                btnEl.style.color = "#ffffff";
                btnEl.style.boxShadow = "0 6px 16px rgba(224, 82, 82, 0.35)";
                btnEl.disabled = false;
            }
        }

        function setUIEnded(msg) {
            flowStage = "ENDED";
            stopTimer();

            const statusEl = document.getElementById("call-status");
            const btnTextEl = document.getElementById("btn-text");
            const btnEl = document.getElementById("action-btn");

            if (statusEl) statusEl.innerText = msg || "통화가 종료되었습니다.";
            if (btnTextEl) btnTextEl.innerText = "통화 종료됨";
            if (btnEl) {
                btnEl.style.backgroundColor = "#a0aec0";
                btnEl.style.color = "#ffffff";
                btnEl.style.boxShadow = "none";
                btnEl.disabled = true;
            }
        }

        async function handleButtonClick() {
            const btnTextEl = document.getElementById("btn-text");
            const btnEl = document.getElementById("action-btn");

            // STAGE 1: Free Trial Start -> Verifying
            if (flowStage === "START") {
                flowStage = "VERIFYING";
                if (btnTextEl) btnTextEl.innerText = "인증 확인 중...";
                if (btnEl) btnEl.disabled = true;

                setTimeout(() => {
                    setUIReady();
                }, 800);
                return;
            }

            // STAGE 2: Call Launch
            if (flowStage === "READY") {
                unlockWebViewAudio();

                // Mic hardware check
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        stream.getTracks().forEach(track => track.stop());
                    } catch (micErr) {
                        alert("마이크 권한이 거부되었습니다. 브라우저 설정에서 마이크 허용을 확인해 주세요.");
                        return;
                    }
                }

                const vapiSdkObj = window.vapi || window.vapiSDK;

                if (vapiSdkObj && typeof vapiSdkObj.run === 'function') {
                    vapiInstance = vapiSdkObj;

                    // Immediately transition UI to Active Call & start timer
                    setUIInCall();
                    startTimer();

                    // Launch Vapi WebRTC
                    vapiInstance.run({
                        apiKey: VAPI_KEY,
                        assistant: VAPI_ASSISTANT_ID,
                        assistantOverrides: {
                            variableValues: { studentName: "Student" }
                        }
                    });
                } else {
                    alert("Vapi SDK가 아직 로딩되지 않았습니다. 잠시 후 다시 시도해 주세요.");
                }
                return;
            }

            // STAGE 3: Call Termination
            if (flowStage === "IN_CALL") {
                try {
                    if (vapiInstance && typeof vapiInstance.stop === 'function') {
                        vapiInstance.stop();
                    }
                } catch(e) {}
                setUIEnded("통화가 종료되었습니다.");
                
                setTimeout(() => {
                    window.location.reload();
                }, 1200);
            }
        }
    </script>
</body>
</html>
