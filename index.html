  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: #f1f6ff;
      position: relative;
    }

    /* Soft Blue Wave Backgrounds */
    .bg-wave-top {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 500px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }
    .bg-wave-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 500px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }

    /* Side Dot Pattern Overlay */
    .dot-pattern-left {
      position: absolute;
      left: 14px;
      top: 42%;
      width: 42px;
      height: 90px;
      background-image: radial-gradient(#c2ddff 2.5px, transparent 2.5px);
      background-size: 11px 11px;
      z-index: 0;
      opacity: 0.65;
    }
    .dot-pattern-right {
      position: absolute;
      right: 14px;
      top: 30%;
      width: 42px;
      height: 90px;
      background-image: radial-gradient(#c2ddff 2.5px, transparent 2.5px);
      background-size: 11px 11px;
      z-index: 0;
      opacity: 0.65;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      height: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 20px 20px 30px 20px;
    }

    /* Header Logo */
    .logo-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .brand-logo-img {
      width: 230px;
      height: auto;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply;
    }

    /* Profile Avatar with Halo Ring */
    .avatar-wrapper {
      position: relative;
    }
    .avatar-wrapper::before {
      content: '';
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(186, 219, 254, 0.6) 0%, rgba(219, 234, 254, 0.1) 70%);
      z-index: -1;
    }
    .avatar {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 10px 25px rgba(11, 26, 62, 0.08);
      display: block;
      background-color: #e2e8f0;
    }

    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: #0b1a3e;
      margin: 0 0 0.4rem 0;
      letter-spacing: -0.6px;
    }
    .subtitle {
      font-size: 1.1rem;
      font-weight: 500;
      color: #334155;
      margin: 0;
    }

    /* Mic Access Notice Box */
    .mic-notice {
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #d0e3ff;
      color: #1e3a8a;
      font-size: 0.98rem;
      font-weight: 500;
      padding: 16px 20px;
      border-radius: 18px;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.45;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .mic-icon {
      font-size: 1.4rem;
    }

    .guide-text {
      font-size: 1rem;
      color: #475569;
      line-height: 1.55;
      margin: 0;
      padding-bottom: 10px;
    }

  <!-- Top Wave Vector -->

    <!-- Mic Authorization Banner -->

    <!-- Call Instructions -->
    <p class="guide-text">
      우측 하단의 📞 <b>통화 버튼</b>을 눌러<br>
