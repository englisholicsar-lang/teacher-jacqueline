<!DOCTYPE html>

<head>

        var g = d.createElement(t),
            s = d.getElementsByTagName(t)[0];

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100vh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f8ff;
      position: relative;
    }

    /* Soft Background Waves */
    .bg-wave-top {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 480px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }
    .bg-wave-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 480px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }

    /* Side Dot Matrix Patterns */
    .dot-pattern-left {
      position: absolute;
      left: 10px;
      top: 42%;
      width: 36px;
      height: 70px;
      background-image: radial-gradient(#c2ddff 2.2px, transparent 2.2px);
      background-size: 10px 10px;
      z-index: 0;
      opacity: 0.6;
    }
    .dot-pattern-right {
      position: absolute;
      right: 10px;
      top: 30%;
      width: 36px;
      height: 70px;
      background-image: radial-gradient(#c2ddff 2.2px, transparent 2.2px);
      background-size: 10px 10px;
      z-index: 0;
      opacity: 0.6;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 350px;
      height: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 10px 18px 75px 18px;
    }

    /* Brand Logo */
    .logo-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 2px;
    }
    .brand-logo-img {
      width: 190px;
      max-width: 68%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* Teacher Avatar with Soft Halo Glow */
    .avatar-wrapper {
      position: relative;
    }
    .avatar-wrapper::before {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(186, 219, 254, 0.65) 0%, rgba(219, 234, 254, 0.15) 70%);
      z-index: -1;
    }
    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      box-shadow: 0 6px 18px rgba(11, 26, 62, 0.08);
      display: block;
      background-color: #e2e8f0;
    }

    /* Typography */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0b1a3e;
      margin: 0 0 4px 0;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }
    .subtitle {
      font-size: 0.82rem;
      font-weight: 400;
      color: #475569;
      margin: 0;
      white-space: nowrap;
    }

    /* Mic Notice Card */
    .mic-notice {
      background-color: #edf4ff;
      border: 1px solid #d0e3ff;
      color: #1e3a8a;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.35;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .mic-icon {
      font-size: 1.25rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .mic-notice-text {
      text-align: center;
    }

    /* Bottom Instructions Text */
    .guide-text {
      font-size: 0.8rem;
      color: #334155;
      line-height: 1.38;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Wave Background -->
  <svg class="bg-wave-top" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M150 0C250 80 380 40 500 120V0H150Z" fill="#D2E5FF" fill-opacity="0.75"/>
    <path d="M220 0C320 60 420 30 500 90V0H220Z" fill="#B9D7FF" fill-opacity="0.85"/>
  </svg>

  <!-- Bottom Wave Background -->
  <svg class="bg-wave-bottom" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 180C120 180 220 280 400 240C450 228 480 210 500 200V300H0V180Z" fill="#D2E5FF" fill-opacity="0.75"/>
    <path d="M0 220C100 220 180 290 320 270C380 260 450 230 500 220V300H0V220Z" fill="#A8D0FF" fill-opacity="0.85"/>
  </svg>

  <!-- Side Dot Matrix Patterns -->
  <div class="dot-pattern-left"></div>
  <div class="dot-pattern-right"></div>

  <div class="container">
    <!-- Brand Logo -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="Englisholic Logo" class="brand-logo-img">
    </div>

    <!-- Teacher Jacqueline Profile Photo -->
    <div class="avatar-wrapper">
      <img src="jacqueline.png" alt="Teacher Jacqueline" class="avatar" loading="eager" decoding="sync">
    </div>

    <!-- Title & Subtitle -->
    <div class="text-group">
      <h1>Teacher Jacqueline</h1>
      <p class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>
    </div>

    <!-- Mic Notice Box -->
    <div class="mic-notice">
      <span class="mic-icon">🎙️</span>
      <div class="mic-notice-text">
        원활한 통화를 위해 마이크 권한을<br>허용해 주세요.
      </div>
    </div>

    <!-- Bottom Guide Text -->
    <p class="guide-text">
      우측 하단의 📞 <b>통화 버튼</b>을 눌러<br>
      Jacqueline 선생님과 무료 체험 수업을<br>시작하세요!
    </p>
  </div>

</body>
</html>
