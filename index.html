  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100vh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Strict no-scroll lock */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f8ff;
      position: relative;
    }

    /* Wave Background Layers */
    .bg-wave-top {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 480px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }
    .bg-wave-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 480px;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
    }

    /* Side Dot Matrix Patterns */
    .dot-pattern-left {
      position: absolute;
      left: 12px;
      top: 42%;
      width: 38px;
      height: 75px;
      background-image: radial-gradient(#c2ddff 2.5px, transparent 2.5px);
      background-size: 11px 11px;
      z-index: 0;
      opacity: 0.65;
    }
    .dot-pattern-right {
      position: absolute;
      right: 12px;
      top: 30%;
      width: 38px;
      height: 75px;
      background-image: radial-gradient(#c2ddff 2.5px, transparent 2.5px);
      background-size: 11px 11px;
      z-index: 0;
      opacity: 0.65;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      height: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 10px 16px 85px 16px;
    }

    /* Seamless Logo Blending */
    .logo-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 2px;
    }
    .brand-logo-img {
      width: 210px;
      max-width: 70%;
      height: auto;
      object-fit: contain;
      display: block;
      /* Multiply blend mode makes white background invisible against blue waves */
      mix-blend-mode: multiply;
    }

    /* Profile Avatar with Soft Halo Border */
    .avatar-wrapper {
      position: relative;
    }
    .avatar-wrapper::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(186, 219, 254, 0.65) 0%, rgba(219, 234, 254, 0.15) 70%);
      z-index: -1;
    }
    .avatar {
      width: 135px;
      height: 135px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      box-shadow: 0 8px 22px rgba(11, 26, 62, 0.08);
      display: block;
      background-color: #e2e8f0;
    }

    /* Typography */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0b1a3e;
      margin: 0 0 2px 0;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .subtitle {
      font-size: 0.92rem;
      font-weight: 500;
      color: #334155;
      margin: 0;
    }

    /* Mic Permission Notice Box */
    .mic-notice {
      background-color: #edf4ff;
      border: 1px solid #c8deff;
      color: #1e3a8a;
      font-size: 0.83rem;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 14px;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.35;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .mic-icon {
      font-size: 1.3rem;
      line-height: 1;
    }

    /* Bottom Guide Text */
    .guide-text {
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.45;
      margin: 0;
    }

    <!-- Teacher Jacqueline Profile Photo -->
    <div class="avatar-wrapper">

    <!-- Mic Permission Notice Box -->
    <div class="mic-notice">
      <span class="mic-icon">🎙️</span>
      <span>원활한 통화를 위해 마이크 권한을<br>허용해 주세요.</span>
    </div>

    <!-- Call Instructions -->

      우측 하단의 📞 <b>통화 버튼</b>을 눌러<br>
