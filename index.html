<script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby5kz-Y8bNFNVhcSZjhHqPyqzV5JKJRoO-xlhu3jb_VCqnKAZ8-ukixS6p0t6Hf6iu52A/exec";
        const VAPI_PUBLIC_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";       
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        function getDeviceHashSync() {
            try {
                const str = [
                    navigator.userAgent,
                    screen.width + "x" + screen.height,
                    screen.colorDepth,
                    new Date().getTimezoneOffset(),
                    navigator.language
                ].join("|");

                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash |= 0;
                }
                return "dev_" + Math.abs(hash).toString(16);
            } catch (e) {
                return "kakao_fallback_" + Date.now();
            }
        }

        function verifyAndInitializeCall() {
            const authBtn = document.getElementById("auth-btn");
            authBtn.disabled = true;

            const deviceHash = getDeviceHashSync();
            const callbackName = "gasCallback_" + Math.floor(Math.random() * 1000000);

            // Define Global Callback function for JSONP
            window[callbackName] = function(data) {
                // Cleanup script tag
                delete window[callbackName];
                const scriptElem = document.getElementById(callbackName);
                if (scriptElem) scriptElem.remove();

                if (data && data.status === "EXISTS") {
                    alert("이미 무료 체험을 사용하셨습니다. (1회 제한)");
                    authBtn.style.display = "flex";
                    authBtn.disabled = false;
                    return;
                }

                // First attempt -> start call
                authBtn.style.display = "none";

                if (window.vapiSDK && typeof window.vapiSDK.run === "function") {
                    window.vapiSDK.run({
                        apiKey: VAPI_PUBLIC_KEY,
                        assistant: VAPI_ASSISTANT_ID
                    });
                } else {
                    alert("통화 모듈을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.");
                }
            };

            // Inject script element to bypass CORS in WebViews
            const script = document.createElement("script");
            script.id = callbackName;
            script.src = `${GAS_WEB_APP_URL}?deviceHash=${encodeURIComponent(deviceHash)}&callback=${callbackName}`;
            script.onerror = function() {
                alert("네트워크 상태를 확인 후 다시 시도해 주세요.");
                authBtn.disabled = false;
            };
            document.body.appendChild(script);
        }
    </script>
