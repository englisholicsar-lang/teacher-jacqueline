<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Englisholic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #f4f8ff;
            color: #1e293b;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 100px; /* Space for floating button */
        }

        /* Top Decorative Wave */
        .bg-wave-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 0;
            pointer-events: none;
        }

        /* Bottom Decorative Wave */
        .bg-wave-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 0;
            pointer-events: none;
        }

        /* Dot Grid Accents */
        .dot-grid {
            position: absolute;
            width: 70px;
            height: 70px;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 10px 10px;
            z-index: 1;
            opacity: 0.6;
        }

        .dot-grid-left {
            top: 380px;
            left: 15px;
        }

        .dot-grid-right {
            top: 260px;
            right: 15px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Logo Header */
        .logo-container {
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .logo-img {
            max-width: 190px;
            height: auto;
            display: block;
        }

        /* Profile Card */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 20px rgba(148, 163, 184, 0.25);
            margin-bottom: 12px;
        }

        .teacher-name {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .teacher-subtitle {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 500;
        }

        /* Microphone Permission Notice Box */
        .mic-notice-card {
            width: 100%;
            background: #eef5ff;
            border: 1px solid #dbeafe;
            border-radius: 14px;
            padding: 14px 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(219, 234, 254, 0.5);
        }

        .mic-icon {
            font-size: 22px;
            line-height: 1;
        }

        .mic-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #1e40af;
            line-height: 1.4;
            text-align: center;
        }

        /* Instruction Text */
        .instruction-text {
            font-size: 13.5px;
            color: #475569;
            line-height: 1.5;
            font-weight: 500;
        }

        .instruction-text strong {
            color: #0f172a;
            font-weight: 700;
        }

        /* Floating Call Button (Bottom Right) */
        .floating-btn-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 1000;
        }

        .vapi-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background-color: #4ade80; /* Green */
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(74, 222, 128, 0.45);
            transition: all 0.3s ease;
        }

        .vapi-btn.calling {
            background-color: #ef4444; /* Red when active/connecting */
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .vapi-btn:active {
            transform: scale(0.92);
        }

        .vapi-btn:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            animation: none;
        }

        .vapi-btn svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: #0f172a;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .vapi-btn.calling svg {
            stroke: #ffffff; /* White icon on red button */
        }
    </style>
</head>
<body>

    <!-- Background Waves -->
    <svg class="bg-wave-top" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="#dbeafe" fill-opacity="0.7" d="M0,192L60,181.3C120,171,240,150,360,154.7C480,160,600,192,720,192C840,192,960,160,1080,149.3C1200,139,1320,150,1380,154.7L1440,160L1440,0L0,0Z"></path>
    </svg>

    <svg class="bg-wave-bottom" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="#bfdbfe" fill-opacity="0.6" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,218.7C672,235,768,245,864,224C960,203,1056,149,1152,138.7C1248,128,1344,160,1392,176L1440,192L1440,320L0,320Z"></path>
    </svg>

    <!-- Main Content Container -->
    <div class="container">
        <!-- Dot Accent Grids -->
        <div class="dot-grid dot-grid-left"></div>
        <div class="dot-grid dot-grid-right"></div>

        <!-- Logo Header -->
        <div class="logo-container">
            <img src="logo.png" alt="Englisholic Innovative English" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/190x45?text=Englisholic';">
        </div>

        <!-- Profile Section -->
        <div class="profile-card">
            <img src="jacqueline.png" alt="Teacher Jacqueline" class="avatar-img">
            <h1 class="teacher-name">Teacher Jacqueline</h1>
            <p class="teacher-subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>
        </div>

        <!-- Microphone Notice -->
        <div class="mic-notice-card">
            <span class="mic-icon">🎙️</span>
            <div class="mic-text">
                원활한 통화를 위해 마이크 권한을<br>허용해 주세요.
            </div>
        </div>

        <!-- Instruction Text -->
        <p class="instruction-text">
            우측 하단의 📞 <strong>통화 버튼</strong>을 눌러<br>
            Jacqueline 선생님과 무료 체험 수업을<br>
            시작하세요!
        </p>
    </div>

    <!-- Floating Call Button (Always visible bottom-right) -->
    <div class="floating-btn-container">
        <button id="vapi-call-btn" class="vapi-btn" onclick="startTrialCall()">
            <svg viewBox="0 0 24 24">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        </button>
    </div>

    <!-- Vapi Web SDK Script Tag Configuration -->
    <script>
        var vapiInstance = null;
        const publicKey = "YOUR_VAPI_PUBLIC_KEY";    // Replace with your Vapi Public Key
        const assistantId = "YOUR_VAPI_ASSISTANT_ID"; // Replace with your Vapi Assistant ID

        window.vapiConfig = {
            apiKey: publicKey,
            assistant: assistantId
        };
    </script>
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwI7Gu1wnzQIzOQAeqDZRuHK8UgceArMjxwZTg4i9mLRuu8_QTrYCJHmXExsKbY3WRraQ/exec";

        // Device Fingerprinting Helper
        async function getDeviceHash() {
            const rawIdentifier = [
                navigator.userAgent,
                screen.width + "x" + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.language
            ].join("|");

            const msgBuffer = new TextEncoder().encode(rawIdentifier);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function startTrialCall() {
            const btn = document.getElementById("vapi-call-btn");
            btn.disabled = true;
            btn.classList.add("calling");

            try {
                const deviceHash = await getDeviceHash();

                // 1. Check existing device hash in Google Sheet
                const response = await fetch(`${GAS_WEB_APP_URL}?deviceHash=${deviceHash}`);
                const result = await response.json();

                if (result.exists) {
                    alert("무료 체험은 1회만 제공됩니다.");
                    btn.disabled = false;
                    btn.classList.remove("calling");
                    return;
                }

                // 2. Record new device hash in Google Sheet
                await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ deviceHash: deviceHash })
                });

                // 3. Start Vapi Voice Call using SDK
                if (window.vapiSDK) {
                    vapiInstance = window.vapiSDK.run({
                        apiKey: publicKey,
                        assistant: assistantId
                    });
                } else {
                    alert("Vapi SDK가 로드되지 않았습니다. 인터넷 연결을 확인해주세요.");
                    btn.disabled = false;
                    btn.classList.remove("calling");
                    return;
                }

                // Listen for call ending to reset button state back to green
                if (vapiInstance && typeof vapiInstance.on === 'function') {
                    vapiInstance.on('call-end', () => {
                        btn.disabled = false;
                        btn.classList.remove("calling");
                    });
                } else {
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.classList.remove("calling");
                    }, 8000);
                }

            } catch (err) {
                console.error("Call launch error:", err);
                alert("통화 연결 중 오류가 발생했습니다. 다시 시도해주세요.");
                btn.disabled = false;
                btn.classList.remove("calling");
            }
        }
    </script>
</body>
</html>
