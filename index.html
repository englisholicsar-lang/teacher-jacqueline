<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Jacqueline | 1:1 English Practice</title>
  
  <!-- Open Graph / KakaoTalk Preview Meta Tags -->
  <meta property="og:title" content="Teacher Jacqueline">
  <meta property="og:description" content="1:1 Native English Speaking Practice - 10-Min Free Trial">
  <meta property="og:image" content="https://i.imgur.com/pslpOpQ.png">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #EBF3FA;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .card img.hero {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .content {
      padding: 28px 24px;
    }
    h1 {
      font-family: Georgia, serif;
      color: #3B759E;
      font-size: 32px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #555555;
      font-size: 15px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .description {
      color: #444444;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .mic-notice {
      color: #666666;
      font-size: 13px;
      margin-bottom: 24px;
      background: #f8f9fa;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .btn-call {
      display: block;
      width: 100%;
      background-color: #4A8BB8;
      color: #ffffff;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-call:hover {
      background-color: #3B759E;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="hero" src="https://i.imgur.com/pslpOpQ.png" alt="Teacher Jacqueline">
    
    <div class="content">
      <h1>Teacher Jacqueline</h1>
      <div class="subtitle">1:1 Native English Speaking & Practice</div>
      
      <p class="description">
        Welcome! Ready for your free 10-minute trial session?<br><br>
        Practice speaking English naturally with real-time feedback—no app downloads or sign-ups required. Tap the button below to start our conversation!
      </p>
      
      <div class="mic-notice">
        💡 통화 연결 시 마이크 사용 권한을 [허용]해 주세요!
      </div>

      <button class="btn-call" id="startCallBtn">📞 Start 10-Min Free Trial</button>
    </div>
  </div>

  <!-- Vapi Web SDK Embed Script -->
  <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
  <script>
    var vapiSDK = null;
    
    // Replace with your actual Vapi Public Key and Assistant ID
    const PUBLIC_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
    const ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

    document.getElementById('startCallBtn').addEventListener('click', function() {
      if (!vapiSDK) {
        vapiSDK = window.vapiSDK.run({
          apiKey: PUBLIC_KEY,
          assistant: ASSISTANT_ID,
          config: {
            position: "bottom-right",
            offset: "20px"
          }
        });
      } else {
        vapiSDK.start();
      }
    });
  </script>

</body>
</html>
