<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Englishholic - Teacher Jacqueline</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Teacher Jacqueline - 1:1 영어회화">
  <meta property="og:description" content="카카오 1초 로그인으로 Jacqueline 선생님과 1:1 영어 회화를 체험해보세요!">
  <meta property="og:image" content="https://englisholicsar-lang.github.io/teacher-jacqueline/jacqueline.png">
  <meta property="og:url" content="https://englisholicsar-lang.github.io/teacher-jacqueline/">

  <!-- Kakao SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>

  <!-- Vapi Official Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 4px solid #EEF2FF;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0.5rem 0;
      color: #1A202C;
    }
    .subtitle {
      color: #4A5568;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }
    .mic-notice {
      background-color: #EDF2F7;
      color: #4A5568;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }
    .btn-kakao {
      background-color: #FEE500;
      color: #000000;
      border: none;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(254, 229, 0, 0.4);
      transition: transform 0.1s ease;
    }
    .btn-kakao:active {
      transform: scale(0.98);
    }
    #status {
      margin-top: 1.2rem;
      font-size: 0.88rem;
      color: #718096;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="jacqueline.png" alt="Teacher Jacqueline" class="avatar" onerror="this.src='https://via.placeholder.com/120?text=Jacqueline'">
    <h1>Teacher Jacqueline</h1>
    <p class="subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>

    <div class="mic-notice">
      🎙️ 원활한 통화를 위해 마이크 권한을 허용해 주세요.
    </div>

    <button class="btn-kakao" onclick="startKakaoTrial()">
      💬 카카오 1초 로그인으로 무료 체험
    </button>

    <div id="status">로그인 시 바로 통화가 시작됩니다.</div>
  </div>

  <script>
    const vapiApiKey = '6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3';
    const assistantId = '7b61af6b-87fe-47cb-a37b-f047f5b6fe8c';
    let vapiInstance = null;

    window.addEventListener('load', function() {
      // 카카오 SDK 초기화
      if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
        Kakao.init('adad030abdf866a8b3be558c979ddb03');
      }

      // Vapi 인스턴스 사전 생성
      try {
        if (typeof Vapi !== 'undefined') {
          vapiInstance = new Vapi(vapiApiKey);
        }
      } catch (e) {
        console.log("Vapi Init Error:", e);
      }
    });

    function startKakaoTrial() {
      const statusDiv = document.getElementById('status');

      if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
        alert("인증 모듈을 준비하는 중입니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      statusDiv.innerText = "통화 연결 중...";

      try {
        Kakao.Auth.login({
          success: function(authObj) {
            connectVoiceCall();
          },
          fail: function(err) {
            connectVoiceCall();
          }
        });
      } catch (e) {
        connectVoiceCall();
      }
    }

    function connectVoiceCall() {
      const statusDiv = document.getElementById('status');

      // Vapi 객체 재확인 및 생성
      if (!vapiInstance && typeof Vapi !== 'undefined') {
        try {
          vapiInstance = new Vapi(vapiApiKey);
        } catch (e) {
          console.log(e);
        }
      }

      if (!vapiInstance) {
        statusDiv.innerText = "마이크를 초기화할 수 없습니다. 페이지를 새로고침해 주세요.";
        return;
      }

      statusDiv.innerText = "🎙️ 통화가 연결되었습니다! Jacqueline 선생님과 대화해 보세요.";
      
      try {
        vapiInstance.start(assistantId);
      } catch (e) {
        console.error("Vapi start error:", e);
      }
    }
  </script>

</body>
</html>
