<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Jacqueline - 1:1 영어회화</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { width: 100%; min-height: 100vh; background-color: #f4f8ff; color: #1e293b; display: flex; flex-direction: column; align-items: center; position: relative; padding-bottom: 120px; }
        
        #vapi-support-btn, [class*="vapi-btn-container"] {
            position: fixed !important; bottom: 30px !important; right: 20px !important; z-index: 88888 !important;
        }

        .container { width: 100%; max-width: 420px; padding: 20px; text-align: center; position: relative; z-index: 2; }
        .logo-img { max-width: 210px; height: auto; }
        .avatar-img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #fff; margin-bottom: 14px; }
        .teacher-name { font-size: 26px; font-weight: 800; color: #0f172a; }
        .teacher-subtitle { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        
        .mic-notice-card { background: #eef5ff; border: 1px solid #dbeafe; border-radius: 16px; padding: 14px; margin-bottom: 20px; }
        .instruction-text { font-size: 14px; color: #475569; }

        .floating-btn-container { position: fixed; bottom: 30px; right: 20px; z-index: 999999; }
        .auth-btn { width: 68px; height: 68px; border-radius: 50%; background-color: #60a5fa; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(96,165,250,0.45); color: #fff; }
        .auth-btn svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 2; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="logo.png" alt="Englisholic" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/210x50?text=Englisholic';">
        </div>
        <div class="profile-card">
            <img src="jacqueline.png" alt="Teacher Jacqueline" class="avatar-img">
            <h1 class="teacher-name">Teacher Jacqueline</h1>
            <p class="teacher-subtitle">재클린 선생님과의 1:1 맞춤 영어회화</p>
        </div>
        <div class="mic-notice-card">
            <div class="mic-text">🎙️ 원활한 통화를 위해 마이크 권한을 허용해 주세요.</div>
        </div>
        <p class="instruction-text">
            <span style="color:#60a5fa; font-weight:bold;">🛡️ 인증</span> 버튼을 누르면 통화 버튼이 생성됩니다.
        </p>
    </div>

    <!-- Shield Overlay Button -->
    <div class="floating-btn-container" id="auth-container">
        <button id="auth-btn" class="auth-btn" onclick="handleAuthClick()">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
        </button>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby5kz-Y8bNFNVhcSZjhHqPyqzV5JKJRoO-xlhu3jb_VCqnKAZ8-ukixS6p0t6Hf6iu52A/exec";
        const VAPI_PUBLIC_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";       
        const VAPI_ASSISTANT_ID = "7b61af6b-87fe-47cb-a37b-f047f5b6fe8c";

        function getDeviceHashSync() {
            try {
                const str = [navigator.userAgent, screen.width + "x" + screen.height, screen.colorDepth, new Date().getTimezoneOffset(), navigator.language].join("|");
                let hash = 0;
                for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
                return "dev_" + Math.abs(hash).toString(16);
            } catch (e) {
                return "kakao_fallback_" + Date.now();
            }
        }

        function handleAuthClick() {
            if (localStorage.getItem("englisholic_trial_used") === "true") {
                alert("이미 무료 체험을 사용하셨습니다. (1회 제한)");
                return;
            }

            localStorage.setItem("englisholic_trial_used", "true");

            const deviceHash = getDeviceHashSync();
            const beaconUrl = `${GAS_WEB_APP_URL}?deviceHash=${encodeURIComponent(deviceHash)}&t=${Date.now()}`;
            
            if (navigator.sendBeacon) {
                navigator.sendBeacon(beaconUrl);
            } else {
                fetch(beaconUrl, { method: 'GET', mode: 'no-cors' }).catch(() => {});
            }

            document.getElementById("auth-container").style.display = "none";

            const vapiBtn = document.getElementById("vapi-support-btn") || document.querySelector('[class*="vapi-btn"]');
            if (vapiBtn) vapiBtn.click();
        }
    </script>

    <!-- Load Vapi SDK -->
    <script id="vapi-sdk-script" src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
    <script>
        window.addEventListener('load', function() {
            if (window.vapiSDK && typeof window.vapiSDK.run === 'function') {
                window.vapiSDK.run({
                    apiKey: VAPI_PUBLIC_KEY,
                    assistant: VAPI_ASSISTANT_ID
                });
            }
        });
    </script>
</body>
</html>
