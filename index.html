<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Englisholic - Teacher Jacqueline Free Trial</title>
    <!-- Kakao SDK -->
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #0e2a47; font-size: 22px; margin-bottom: 10px; }
        p { color: #4a637d; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .btn-kakao {
            background-color: #fee500;
            color: #191919;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-kakao:hover { background-color: #fdd835; }
        #vapi-container { display: none; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <div class="container" id="auth-container">
        <h1>Teacher Jacqueline 10분 무료 체험</h1>
        <p>재클린 선생님과 실시간 AI 영어 회화 레벨 테스트를 시작해 보세요!</p>
        <button class="btn-kakao" onclick="startKakaoAuth()">
            <span>카카오 1초 로그인 후 시작하기</span>
        </button>
    </div>

    <div class="container" id="vapi-container">
        <h1>체험 진행 중...</h1>
        <p>재클린 선생님이 연결되었습니다. 마이크를 켜고 대화를 나누세요!</p>
        <button style="background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;" onclick="endCallManually()">통화 종료하기</button>
    </div>

    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
    <script>
        // --- CONFIGURATION ---
        const GAS_URL = "YOUR_NEW_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"; // <-- Paste your deployment URL here
        const KAKAO_CLIENT_ID = "YOUR_KAKAO_JAVASCRIPT_KEY_HERE";         // <-- Your Kakao JS key
        const VAPI_ASSISTANT_ID = "ab0d16c5-842d-40c6-8fa4-055fee015089";  // <-- Your Vapi Assistant ID

        let currentKakaoNickname = "Student";
        let vapiInstance = null;

        // Generate unique browser fingerprint/device hash to prevent abuse
        function getDeviceHash() {
            let hash = localStorage.getItem("englisholic_device_hash");
            if (!hash) {
                hash = 'dev_' + Math.random().toString(36.2) + Date.now().toString(36);
                localStorage.setItem("englisholic_device_hash", hash);
            }
            return hash;
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (typeof Kakao !== "undefined" && !Kakao.isInitialized()) {
                    Kakao.init(KAKAO_CLIENT_ID);
                }
            } catch (e) {
                console.log("Kakao init note:", e);
            }

            // --- REPEAT TRIAL BLOCKER CHECK ---
            const deviceHash = getDeviceHash();
            if (localStorage.getItem("englisholic_trial_completed_" + deviceHash)) {
                document.getElementById("auth-container").innerHTML = `
                    <h2 style="color: #0e2a47; font-size: 18px; margin-bottom: 10px;">체험 완료 안내</h2>
                    <p style="color: #4a637d; font-size: 14px;">이 기기에서는 이미 10분 무료 체험을 완료하셨습니다.<br>정규 수업 등록 및 문의는 공식 홈페이지를 이용해 주세요!</p>
                `;
            }
        });

        function startKakaoAuth() {
            try {
                if (typeof Kakao !== "undefined" && Kakao.isInitialized()) {
                    Kakao.Auth.login({
                        success: function(authObj) {
                            Kakao.API.request({
                                url: '/v2/user/me',
                                success: function(res) {
                                    currentKakaoNickname = res.properties?.nickname || res.kakao_account?.profile?.nickname || "Kakao User";
                                    sendWebRegistration(currentKakaoNickname);
                                    initializeVapiCall();
                                },
                                fail: function(error) {
                                    console.log("Kakao user info fetch failed, proceeding as Guest", error);
                                    sendWebRegistration("Guest User");
                                    initializeVapiCall();
                                }
                            });
                        },
                        fail: function(err) {
                            console.log("Kakao login failed, proceeding as Guest", err);
                            sendWebRegistration("Guest User");
                            initializeVapiCall();
                        }
                    });
                } else {
                    sendWebRegistration("Guest User");
                    initializeVapiCall();
                }
            } catch (e) {
                console.log("Auth catch note:", e);
                sendWebRegistration("Guest User");
                initializeVapiCall();
            }
        }

        function sendWebRegistration(nickname) {
            const payload = {
                type: "web-registration",
                kakaoNickname: nickname,
                deviceHash: getDeviceHash()
            };

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Web reg log error:", err));
        }

        function initializeVapiCall() {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("vapi-container").style.display = "flex";

            if (window.vapiSDK) {
                vapiInstance = window.vapiSDK.run({
                    apiKey: "YOUR_VAPI_PUBLIC_API_KEY_HERE", // <-- Your Vapi Public API Key
                    assistant: VAPI_ASSISTANT_ID,
                    config: {
                        metadata: {
                            nickname: currentKakaoNickname,
                            deviceHash: getDeviceHash(),
                            phone_number: "Not Provided"
                        }
                    }
                });

                // Listen for call termination to lock device
                vapiInstance.on('call-end', () => {
                    localStorage.setItem("englisholic_trial_completed_" + getDeviceHash(), "true");
                    alert("체험이 종료되었습니다. 이용해주셔서 감사합니다!");
                    window.location.reload();
                });
            }
        }

        function endCallManually() {
            if (vapiInstance && typeof vapiInstance.stop === 'function') {
                vapiInstance.stop();
            }
            localStorage.setItem("englisholic_trial_completed_" + getDeviceHash(), "true");
            window.location.reload();
        }
    </script>
</body>
</html>
