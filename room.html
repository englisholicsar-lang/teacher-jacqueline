<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>잉글리쉬홀릭 - Live Session</title>
    
    <script>var vapiInstance = null;</script>
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js" defer></script>

    <style>
        :root { --bg-base: #f0f6ff; --primary-navy: #0e2a47; --sub-text: #4a637d; --box-bg: #eaf3fe; --box-border: #d4e5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; background-color: var(--bg-base); display: flex; flex-direction: column; align-items: center; padding: 0px 20px 16px 20px; color: var(--primary-navy); }
        .container { position: relative; z-index: 1; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 20px; }
        .logo-img { height: 65px; margin-bottom: 6px; }
        .avatar-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 6px 18px rgba(12, 42, 74, 0.12); margin-bottom: 6px; }
        .title { font-size: 21px; font-weight: 800; color: #0c2a4a; margin-bottom: 2px; }
        .subtitle { font-size: 13px; font-weight: 600; color: #4a637d; }
        .timer-display { font-size: 17px; font-weight: 800; background: #ffffff; padding: 6px 16px; border-radius: 20px; border: 2px solid #d4e5f9; margin-top: 8px; }
        .info-box { width: 100%; background-color: var(--box-bg); border: 1px solid var(--box-border); border-radius: 14px; padding: 10px; margin-top: 14px; margin-bottom: 10px; font-size: 13px; font-weight: 800; }
        .action-btn { width: 100%; background-color: #059669; color: #ffffff; border: none; padding: 14px 18px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35); }
        .action-btn:disabled { background-color: #a0aec0; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>
    <audio id="remote-audio" autoplay playsinline controls style="display: none;"></audio>
    <div id="main-container" class="container">
        <img src="logo.png" alt="Englisholic Logo" class="logo-img">
        <img id="teacherImg" class="avatar-img" src="jacqueline.png" alt="Teacher">
        <h1 id="mainTitle" class="title">Teacher Jacqueline</h1>
        <p id="call-status" class="subtitle">인증 상태 확인 중...</p>
        <div id="timer-wrapper" style="display: none;"><div id="timer" class="timer-display">⏱️ 00:00 / 10:00</div></div>
        
        <div class="info-box">
            🔊 스피커폰으로 기본 설정됩니다.<br>🎧 이어폰은 통화 시작 전 연결해 주세요!
        </div>
        <button id="action-btn" class="action-btn" onclick="handleMainAction()" disabled><span id="btn-text-content">데이터 동기화 중...</span></button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxGFDkjGSgl8_p4jdl6DZV6Z87y1mY5QMv1f2kH8KokerqpKnTZKSRgSQDIzUntL3t3/exec";
        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        
        let callState = 'IDLE', isUserAllowed = false, timerInterval = null, secondsElapsed = 0;
        let activeAssistantId = "53ed6c7f-9876-4daf-9f9f-d7181b72a626", sessionStudentName = "Student", sessionCoachingNotes = "";
        
        const urlParams = new URLSearchParams(window.location.search), token = urlParams.get('token');
        
        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById("action-btn");
            if (!token) {
                document.getElementById("call-status").innerText = "유효하지 않은 링크입니다."; 
                btn.innerText = "입장 불가"; 
                return;
            }
            
            let fetchUrl = token === 'englisholic-admin-master-2026' ? `${GAS_URL}?key=${token}` : `${GAS_URL}?token=${token}`;
            
            fetch(fetchUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.allowed) {
                        isUserAllowed = true;
                        sessionStudentName = data.studentName || "Student"; 
                        sessionCoachingNotes = data.coachingNotes || ""; 
                        if (data.assistantId) activeAssistantId = data.assistantId;
                        
                        document.getElementById("mainTitle").innerText = `Teacher ${data.teacher || 'Jacqueline'}`;
                        document.getElementById("call-status").innerText = `${sessionStudentName} 회원님, 수업 준비가 완료되었습니다.`;
                        btn.removeAttribute("disabled"); 
                        document.getElementById("btn-text-content").innerText = "📞 통화시작하기";
                    } else {
                        document.getElementById("call-status").innerText = data.message || "종료된 수업 링크입니다."; 
                        btn.disabled = true;
                    }
                })
                .catch(err => { 
                    document.getElementById("call-status").innerText = "서버 연결 오류."; 
                });
        });

        async function handleMainAction() {
            if (!isUserAllowed) return;
            const btn = document.getElementById("action-btn");
            
            if (callState === 'IDLE') {
                btn.setAttribute("disabled", "true"); 
                document.getElementById("btn-text-content").innerText = "통화 연결 중...";
                
                try {
                    vapiInstance = window.vapiSDK.run({
                        apiKey: VAPI_KEY, 
                        assistant: activeAssistantId, 
                        config: { 
                            variableValues: { 
                                student_name: sessionStudentName, 
                                coaching_notes: sessionCoachingNotes
                            } 
                        }
                    });
                    
                    if (vapiInstance) {
                        // THE DIAGNOSTIC CATCHER - THIS WILL POP UP THE EXACT ERROR
                        vapiInstance.on('error', (e) => {
                            console.error("Vapi Error:", e);
                            alert("VAPI 시스템 에러: " + (e.message || JSON.stringify(e)));
                            btn.removeAttribute("disabled");
                            document.getElementById("btn-text-content").innerText = "📞 통화시작하기";
                        });

                        vapiInstance.on('call-start', () => {
                            startTimer(); 
                            callState = 'ACTIVE';
                            if (sessionCoachingNotes) { 
                                vapiInstance.send({ type: "add-message", message: { role: "system", content: `Today's Custom Coaching Notes: "${sessionCoachingNotes}".` } }); 
                            }
                            document.getElementById("call-status").innerText = "통화가 연결되었습니다.";
                            btn.style.backgroundColor = "#e05252"; 
                            btn.removeAttribute("disabled"); 
                            document.getElementById("btn-text-content").innerText = "통화 종료하기";
                        });
                        
                        vapiInstance.on('call-end', () => { endCallUI(); });
                    }
                } catch (err) { 
                    alert("코드 실행 오류: " + err.message); 
                    btn.removeAttribute("disabled"); 
                    document.getElementById("btn-text-content").innerText = "📞 통화시작하기"; 
                }
            } else if (callState === 'ACTIVE') { 
                endCallUI(); 
            }
        }
        
        function formatTime(secs) { 
            const m = Math.floor(secs / 60), s = secs % 60; 
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s); 
        }
        
        function startTimer() {
            document.getElementById("timer-wrapper").style.display = "flex";
            timerInterval = setInterval(() => {
                secondsElapsed++; 
                document.getElementById("timer").innerText = "⏱️ " + formatTime(secondsElapsed) + " / 10:00";
                
                if (secondsElapsed === 570 && vapiInstance) vapiInstance.send({ type: "add-message", message: { role: "system", content: "[SYSTEM ALERT: 9:30 elapsed. Do not hang up, just say goodbye.]" }});
                if (secondsElapsed >= 600) endCallUI();
            }, 1000);
        }
        
        function endCallUI() {
            clearInterval(timerInterval); 
            if (vapiInstance) { try { vapiInstance.stop(); } catch(e) {} }
            callState = 'ENDED'; 
            document.getElementById("call-status").innerText = "수고하셨습니다!";
            const btn = document.getElementById("action-btn"); 
            btn.style.backgroundColor = "#10b981"; 
            btn.removeAttribute("disabled"); 
            document.getElementById("btn-text-content").innerText = "종료됨";
        }
    </script>
</body>
</html>
