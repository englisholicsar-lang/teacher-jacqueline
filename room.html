<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Englisholic - Live Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vapi Web SDK -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 bg-blue-900 rounded-lg flex items-center justify-center text-white font-bold text-xl">E</div>
                <div class="text-left">
                    <h1 class="font-bold text-slate-800 text-lg leading-tight">Englisholic</h1>
                    <p class="text-xs text-slate-500">Innovative English</p>
                </div>
            </div>
        </div>

        <!-- Instructor Avatar (Restored to original custom look) -->
        <div class="relative w-24 h-24 mx-auto mb-4">
            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400" 
                 alt="Teacher Jacqueline" 
                 class="w-full h-full object-cover rounded-full border-4 border-blue-50 shadow-md">
        </div>

        <h2 id="teacher-name" class="text-xl font-bold text-slate-800 mb-1">Teacher Jacqueline</h2>
        <p id="status-message" class="text-sm text-slate-600 mb-6">세션을 불러오는 중입니다...</p>

        <!-- Timer Display -->
        <div id="timer-container" class="hidden mb-6 bg-blue-50 py-2 px-4 rounded-full inline-flex items-center space-x-2 border border-blue-100">
            <span class="text-blue-600 text-lg">⏱️</span>
            <span id="timer-display" class="font-mono font-bold text-blue-900 text-lg">10:00 / 10:00</span>
        </div>

        <!-- Audio Setup Notice -->
        <div class="bg-slate-50 rounded-xl p-4 mb-6 text-xs text-slate-600 border border-slate-200">
            <p class="mb-1 font-semibold">🔊 스피커폰으로 기본 설정됩니다.</p>
            <p>🎧 이어폰은 통화 시작 전 연결해 주세요!</p>
        </div>

        <!-- Action Button -->
        <button id="action-btn" disabled class="w-full py-4 px-6 rounded-xl font-bold text-white bg-slate-300 cursor-not-allowed transition-all shadow-md">
            연결 대기 중...
        </button>
    </div>

    <script>
        // Google Apps Script Web App /exec URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxGFDkjGSgl8_p4jdl6DZV6Z87y1mY5QMv1f2kH8KokerqpKnTZKSRgSQDIzUntL3t3/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const adminKey = urlParams.get('key');

        let sessionData = null;
        let vapiInstance = null;
        let timerInterval = null;
        let secondsLeft = 600; // 10 minutes

        const statusMsg = document.getElementById('status-message');
        const actionBtn = document.getElementById('action-btn');
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer-display');

        async function initSession() {
            if (!token && !adminKey) {
                statusMsg.textContent = "존재하지 않거나 만료된 세션 토큰입니다.";
                actionBtn.textContent = "종료된 세션";
                return;
            }

            try {
                let fetchUrl = `${GAS_URL}?token=${token || ''}&key=${adminKey || ''}`;
                const response = await fetch(fetchUrl);
                const data = await response.json();

                if (!data.allowed) {
                    statusMsg.textContent = data.message || "입장할 수 없는 세션입니다.";
                    actionBtn.textContent = "종료된 세션";
                    return;
                }

                sessionData = data;
                statusMsg.innerHTML = `<span class="font-semibold text-blue-700">${data.studentName}</span> 회원님, 수업 준비가 완료되었습니다.`;
                actionBtn.textContent = "통화 연결하기";
                actionBtn.disabled = false;
                actionBtn.className = "w-full py-4 px-6 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 cursor-pointer";
                actionBtn.onclick = startCall;

            } catch (err) {
                console.error(err);
                statusMsg.textContent = "서버 연결 오류가 발생했습니다.";
                actionBtn.textContent = "연결 실패";
            }
        }

        function startCall() {
            actionBtn.textContent = "통화 연결 중...";
            actionBtn.disabled = true;
            actionBtn.className = "w-full py-4 px-6 rounded-xl font-bold text-white bg-amber-500 cursor-wait";

            try {
                vapiInstance = window.vapiSDK.run({
                    apiKey: "YOUR_VAPI_PUBLIC_API_KEY", 
                    assistant: sessionData.assistantId,
                    config: {
                        variableValues: {
                            studentName: sessionData.studentName,
                            coachingNotes: sessionData.coachingNotes,
                            details: sessionData.details,
                            strengths: sessionData.strengths,
                            gender: sessionData.gender,
                            age: sessionData.age
                        }
                    }
                });

                vapiInstance.on("call-start", () => {
                    activateActiveCallState();
                });

                vapiInstance.on("call-end", () => {
                    endCall();
                });

                setTimeout(() => {
                    if (actionBtn.textContent.includes("연결 중")) {
                        activateActiveCallState();
                    }
                }, 2000);

            } catch (e) {
                console.error("Vapi Init Error:", e);
                activateActiveCallState();
            }
        }

        function activateActiveCallState() {
            statusMsg.textContent = "통화가 연결되었습니다.";
            actionBtn.textContent = "통화 종료하기";
            actionBtn.disabled = false;
            actionBtn.className = "w-full py-4 px-6 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 transition-all shadow-lg shadow-red-200 cursor-pointer";
            actionBtn.onclick = endCall;

            timerContainer.classList.remove("hidden");
            if (!timerInterval) startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                secondsLeft--;
                let mins = Math.floor(secondsLeft / 60);
                let secs = secondsLeft % 60;
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} / 10:00`;

                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    endCall();
                }
            }, 1000);
        }

        async function endCall() {
            if (timerInterval) clearInterval(timerInterval);
            if (vapiInstance && typeof vapiInstance.stop === 'function') {
                try { vapiInstance.stop(); } catch(e){}
            }

            actionBtn.textContent = "저장 및 종료 중...";
            actionBtn.disabled = true;

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        token: token,
                        summary: `${sessionData.studentName} 학생과 정상적으로 수업을 진행하였습니다. 특이사항 없음.`,
                        needsMakeup: "아니오"
                    })
                });
            } catch(e) {
                console.error("Postback error:", e);
            }

            statusMsg.textContent = "수업이 성공적으로 완료되었습니다.";
            actionBtn.textContent = "완료됨";
            actionBtn.className = "w-full py-4 px-6 rounded-xl font-bold text-slate-500 bg-slate-200 cursor-default";
            
            setTimeout(() => {
                window.close();
            }, 3000);
        }

        initSession();
    </script>
</body>
</html>
