<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Englisholic - Live Session</title>
    
    <script>
      var vapiInstance = null;
      (function (d, t) {
        var g = d.createElement(t),
            s = d.getElementsByTagName(t)[0];
        g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g, s);
      })(document, "script");
    </script>

    <style>
        :root {
            --bg-base: #f0f6ff;
            --primary-navy: #0e2a47;
            --sub-text: #4a637d;
            --box-bg: #eaf3fe;
            --box-border: #d4e5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; background-color: var(--bg-base); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; color: var(--primary-navy);
        }
        .container { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 40px; }
        .avatar-container { width: 115px; height: 115px; margin-bottom: 16px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ffffff; box-shadow: 0 6px 18px rgba(12, 42, 74, 0.12); }
        .title { font-size: 22px; font-weight: 800; color: #0c2a4a; margin-bottom: 6px; }
        .subtitle { font-size: 14px; font-weight: 600; color: #4a637d; margin-bottom: 24px; }
        .info-box { width: 100%; background-color: var(--box-bg); border: 1px solid var(--box-border); border-radius: 14px; padding: 16px; margin-bottom: 20px; font-size: 14px; font-weight: 700; line-height: 1.4; }
        .action-btn { width: 100%; background-color: #3b82f6; color: #ffffff; border: none; padding: 16px; border-radius: 14px; font-size: 16.5px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35); }
        .action-btn:disabled { background-color: #cbd5e1; box-shadow: none; cursor: not-allowed; }
        .timer-display { font-size: 18px; font-weight: 800; margin-bottom: 15px; background: #fff; padding: 8px 16px; border-radius: 20px; border: 2px solid #d4e5f9; display: none; }
    </style>
</head>
<body>

    <audio id="remote-audio" autoplay playsinline style="display: none;"></audio>

    <div class="container">
        <div class="avatar-container">
            <img class="avatar-img" src="https://englisholicsar-lang.github.io/teacher-jacqueline/jacqueline.png" alt="AI Instructor">
        </div>
        <h1 id="header-title" class="title">1:1 실시간 AI 영어회화</h1>
        <p id="call-status" class="subtitle">토큰 인증을 확인하고 있습니다...</p>
        
        <div id="timer" class="timer-display">⏱️ 00:00 / 10:00</div>

        <div id="notice-box" class="info-box">
            🔊 스피커폰으로 기본 설정됩니다.<br>통화 시작 전 이어폰을 연결해 주세요!
        </div>

        <button id="action-btn" class="action-btn" onclick="startLiveSession()" disabled>
            인증 대기 중...
        </button>
    </div>

    <script>
        // REPLACE WITH YOUR LATEST DEPLOYED APPS SCRIPT WEB APP URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyulJrE2iIOIoc9hfqjMGJT67EnuL18pWfV7N-Fy4gixd-NGCE_5B_wGqkESWmRkLc/exec";
        
        const VAPI_KEY = "6aeb4233-7c3c-48f6-90fe-ee5d7a40d2a3";
        let resolvedAssistantId = "53ed6c7f-9876-4daf-9f9f-d7181b72a626"; // Fallback Jacqueline
        let studentName = "";
        let timerInterval = null;
        let secondsElapsed = 0;

        // 1. Verify token on page load
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                document.getElementById('call-status').innerText = "⚠️ 유효하지 않은 접근입니다.";
                document.getElementById('notice-box').innerText = "링크에 보안 토큰이 포함되어 있지 않습니다.";
                return;
            }

            try {
                let response = await fetch(`${GAS_URL}?token=${token}&t=${Date.now()}`);
                let result = await response.json();

                if (result && result.allowed === true) {
                    studentName = result.studentName;
                    resolvedAssistantId = result.assistantId; // Dynamic teacher routing!
                    
                    document.getElementById('call-status').innerText = `${studentName} 회원님, 수업 준비가 완료되었습니다.`;
                    document.getElementById('notice-box').innerHTML = `<strong>🟢 입장 승인됨</strong><br>배정 강사: ${result.teacher}<br>맞춤 메모: ${result.coachingNotes}`;
                    
                    const btn = document.getElementById('action-btn');
                    btn.removeAttribute('disabled');
                    btn.innerText = "통화 시작하기";
                } else {
                    document.getElementById('call-status').innerText = "⏳ 수업 시간이 아닙니다.";
                    document.getElementById('notice-box').innerText = result.message || "수업 5분 전에 입장 가능합니다.";
                }
            } catch (err) {
                console.error("Token check error:", err);
                document.getElementById('call-status').innerText = "⚠️ 서버 통신 오류";
            }
        });

        // 2. Launch WebRTC Session
        function startLiveSession() {
            const remoteAudio = document.getElementById("remote-audio");
            if (remoteAudio) {
                remoteAudio.volume = 1.0;
                remoteAudio.play().catch(e => console.log("Audio unlock:", e));
            }

            const sdk = window.vapiSDK || window.vapi || (window.Vapi ? window.Vapi : null);
            if (!sdk) {
                alert("Vapi SDK 로딩 중입니다. 잠시 후 다시 시도해 주세요.");
                return;
            }

            vapiInstance = typeof sdk.run === 'function' 
                ? sdk.run({ apiKey: VAPI_KEY, assistant: resolvedAssistantId })
                : new sdk(VAPI_KEY);

            if (vapiInstance && typeof vapiInstance.on === 'function') {
                vapiInstance.on('call-start', () => {
                    startTimer();
                    document.getElementById('call-status').innerText = "📞 통화가 연결되었습니다.";
                });

                vapiInstance.on('track', (track) => {
                    if (track.kind === 'audio' && remoteAudio) {
                        remoteAudio.muted = false;
                        remoteAudio.srcObject = new MediaStream([track]);
                        remoteAudio.play();
                    }
                });

                vapiInstance.on('call-end', () => {
                    stopTimer();
                    document.getElementById('call-status').innerText = "통화가 종료되었습니다.";
                    document.getElementById('action-btn').innerText = "종료됨";
                    document.getElementById('action-btn').disabled = true;
                });
            }

            if (vapiInstance && typeof vapiInstance.start === 'function') {
                vapiInstance.start(resolvedAssistantId, {
                    metadata: {
                        studentName: studentName
                    }
                });
            }

            const btn = document.getElementById('action-btn');
            btn.style.backgroundColor = "#ef4444";
            btn.innerText = "통화 종료하기";
            btn.onclick = () => { if (vapiInstance) vapiInstance.stop(); };
        }

        function startTimer() {
            document.getElementById("timer").style.display = "block";
            if (timerInterval) clearInterval(timerInterval);
            secondsElapsed = 0;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const s = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById("timer").innerText = `⏱️ ${m}:${s} / 10:00`;
                if (secondsElapsed >= 600) { if (vapiInstance) vapiInstance.stop(); }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }
    </script>
</body>
</html>
