<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Englisholic Gateway Test</title>
    <style>
        body { 
            font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif; 
            background: #0b1329; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .mobile-card { 
            background: linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
            width: 100%; 
            max-width: 380px; 
            border-radius: 24px; 
            padding: 28px 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            box-sizing: border-box; 
            text-align: center; 
        }
        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .brand-logo-img {
            height: 32px; 
            object-fit: contain;
        }
        .teacher-img-container { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            overflow: hidden; 
            margin: 0 auto 12px; 
            border: 3px solid #ffffff; 
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.12); 
        }
        .teacher-img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .teacher-name { 
            font-size: 18px; 
            font-weight: 800; 
            color: #0f172a; 
            margin-bottom: 4px; 
        }
        .teacher-desc { 
            font-size: 12.5px; 
            color: #475569; 
            margin-bottom: 16px; 
            font-weight: 500;
        }
        .notice-box { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 12px 14px; 
            font-size: 12px; 
            color: #334155; 
            text-align: left; 
            margin-bottom: 16px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            line-height: 1.5;
        }
        .notice-box div { display: flex; align-items: center; gap: 6px; }
        .notice-box div:first-child { margin-bottom: 3px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            background: #ffffff; 
            border: 1px solid #cbd5e1; 
            color: #0f172a; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14px; 
            text-align: center; 
            font-weight: 700;
        }
        .call-btn { 
            background: #10b981; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); 
        }
        .call-btn:hover { background: #059669; }
        #resultBox { 
            margin-top: 14px; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 12.5px; 
            display: none; 
            text-align: left; 
            word-break: break-all; 
            line-height: 1.4;
        }
        .admin-box { background: #ecfdf5; color: #065f46; border: 1px solid #10b981; font-weight: 600; }
        .client-box { background: #eff6ff; color: #1e40af; border: 1px solid #3b82f6; font-weight: 600; }
    </style>
</head>
<body>

<div class="mobile-card">
    <!-- Pulling live logo directly from your GitHub repository raw link -->
    <div class="brand-container">
        <img src="https://raw.githubusercontent.com/englisholicsar-lang/teacher-jacqueline/main/logo.png" alt="Englisholic" class="brand-logo-img">
    </div>

    <!-- Pulling live teacher photo directly from your GitHub repository raw link -->
    <div class="teacher-img-container">
        <img src="https://raw.githubusercontent.com/englisholicsar-lang/teacher-jacqueline/main/jacqueline.png" alt="Teacher Jacqueline">
    </div>
    <div class="teacher-name">Teacher Jacqueline</div>
    <div class="teacher-desc">재클린 선생님과의 1:1 맞춤 영어회화</div>

    <!-- Notice Box -->
    <div class="notice-box">
        <div>🔊 스피커폰으로 기본 설정되었습니다.</div>
        <div>🎧 이어폰은 통화 시작 전 연결해 주세요!</div>
    </div>

    <!-- Phone Number Input -->
    <input type="text" id="phoneInput" placeholder="전화번호 입력 (예: 010-1234-5678)" value="010-9741-3002">

    <!-- Green Call Button -->
    <button class="call-btn" onclick="checkAccess()">
        <span>📞</span>
        <span>통화시작하기</span>
    </button>
    
    <div id="resultBox"></div>
</div>
