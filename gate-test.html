<script>
    const ADMIN_WHITELIST = [
        "010-9741-3002",
        "010-4181-7923",
        "010-9544-0247"
    ];

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybN7QYuHCLcR2UDZnCoQx31szufrQuAmbMCXathEa970U9Fr5h3WagjgBcy5oOY_uj/exec";

    function checkAccess() {
        const phone = document.getElementById('phoneInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        resultBox.style.display = "block";

        let roleStatus = "Client Entry";
        if (ADMIN_WHITELIST.includes(phone)) {
            resultBox.className = "admin-box";
            resultBox.innerHTML = "<strong>👑 관리자 권한 승인 (Admin Bypass)</strong><br>통화 발신 요청을 전송 중입니다...";
            roleStatus = "Admin Bypass (Admin)";
        } else {
            resultBox.className = "client-box";
            resultBox.innerHTML = "<strong>👤 일반 수강생 승인 (SMS Link Flow)</strong><br>배정된 정식 클래스룸으로 안전하게 연결됩니다.";
            roleStatus = "Client Entry (User)";
        }

        if (WEB_APP_URL.includes("http")) {
            // Using navigator.sendBeacon or a hidden form/iframe approach to reliably trigger 
            // the Apps Script backend without getting blocked by CORS response policies.
            const payload = JSON.stringify({
                type: "web-registration",
                kakaoId: phone,
                kakaoNickname: roleStatus,
                deviceHash: "mobile-test-env",
                triggerCall: true
            });

            // Fallback fetch using no-cors so the trigger hits the backend script immediately
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: payload
            }).then(() => {
                setTimeout(() => {
                    resultBox.innerHTML = "<strong>👑 발신 요청 완료!</strong><br>Google Sheet 기록 확인 및 Vapi 전화 발신 중입니다.";
                }, 1000);
            }).catch(err => {
                console.log("Log error: ", err);
                resultBox.innerHTML = "<strong>⚠️ 발신 신호 전송됨</strong><br>시트 상태를 확인해주세요.";
            });
        }
    }
</script>
